# This workflow syncs consumer repositories with the latest nanvix/zutils
# release. It runs on a daily schedule (03:00 UTC), can be triggered
# manually via workflow_dispatch, or called from another workflow (e.g.
# the zutils release pipeline) via workflow_call with an explicit tag.
# It resolves the latest release tag of nanvix/zutils (unless one is
# provided), then iterates over each target repo:
#   1. Updating `zutil-version: "vOLD"` to `"vLATEST"` in caller workflows.
#   2. Copying bootstrapper templates (z, z.sh, z.ps1) from the release's
#      templates.tar.gz asset to the repo root.
# A pull request is opened (or refreshed) when changes are detected.

name: Update Zutils Version

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Zutils release tag to sync (e.g. v0.6.0). Resolved from latest release if omitted."
        required: false
        type: string
    secrets:
      DISPATCH_TOKEN:
        description: "PAT with repo scope for cloning/pushing to consumer repos"
        required: true

permissions:
  contents: read

jobs:
  update-zutils:
    name: Update zutils version
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      ASSIGNEE: ppenna
      BOOTSTRAPPER_TEMPLATES: "z z.sh z.ps1"
    steps:
      - name: Checkout workflows repo
        uses: actions/checkout@v5
        with:
          repository: nanvix/workflows
          ref: ${{ github.event_name == 'workflow_call' && github.workflow_sha || github.ref }}

      - name: Resolve latest zutils release tag
        id: latest
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || '' }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh api repos/nanvix/zutils/releases/latest --jq '.tag_name')
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Could not resolve latest release tag for nanvix/zutils"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved latest zutils tag: $TAG"

          REPOS=$(jq -c '.' consumer-repos.json)
          echo "default_repos=$REPOS" >> "$GITHUB_OUTPUT"

      - name: Download bootstrapper templates
        id: templates
        run: |
          set -euo pipefail
          DIR="$(mktemp -d)"
          gh release download "${{ steps.latest.outputs.tag }}" \
            --repo nanvix/zutils \
            --pattern "templates.tar.gz" \
            --dir "$DIR"
          tar xzf "$DIR/templates.tar.gz" -C "$DIR"
          rm "$DIR/templates.tar.gz"

          # Verify that all expected bootstrapper templates are present.
          for TMPL in $BOOTSTRAPPER_TEMPLATES; do
            if [ ! -f "$DIR/$TMPL" ]; then
              echo "::error::Expected template '$TMPL' not found in templates.tar.gz"
              exit 1
            fi
          done

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Extracted bootstrapper templates:"
          ls -la "$DIR"

      - name: Update target repositories
        env:
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
          TARGET_REPOS: ${{ steps.latest.outputs.default_repos }}
          TEMPLATES_DIR: ${{ steps.templates.outputs.dir }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail

          WORK_DIR="$(mktemp -d)"
          BRANCH="automation/update-zutils-version"
          COMMIT_MSG="[ci] E: Update zutils to ${LATEST_TAG}"

          declare -a UPDATED_REPOS=()
          declare -a SKIPPED_REPOS=()
          declare -a FAILED_REPOS=()

          # Process a single consumer repo. Returns 0 on success, 1 on failure.
          # Called inside an `if !` context so set -e does not abort the
          # script on failure; explicit `|| return 1` guards ensure the
          # function signals errors back to the caller.
          update_repo() {
            local REPO="$1"
            local REPO_DIR="$2"

            # Clone only the default branch (shallow).
            gh repo clone "$REPO" "$REPO_DIR" -- --depth 1 2>&1 || return 1

            pushd "$REPO_DIR" >/dev/null || return 1
            # Ensure we always return to the original directory.
            trap 'popd >/dev/null 2>&1 || true' RETURN

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            local DEFAULT_BRANCH
            DEFAULT_BRANCH=$(gh repo view "$REPO" --json defaultBranchRef --jq '.defaultBranchRef.name')
            echo "Default branch: $DEFAULT_BRANCH"

            # Find and update zutil-version in caller workflows.
            local CHANGED=0
            local FILE
            for FILE in .github/workflows/*.yml .github/workflows/*.yaml; do
              [ -f "$FILE" ] || continue
              if grep -qE 'zutil-version:[[:space:]]*"v[^"]+"' "$FILE"; then
                sed -i -E "s|(zutil-version:[[:space:]]*\")v[^\"]+|\1${LATEST_TAG}|g" "$FILE"
                if ! git diff --quiet -- "$FILE"; then
                  git add "$FILE"
                  CHANGED=1
                fi
              fi
            done

            # Copy bootstrapper templates from the release tarball.
            for TMPL in $BOOTSTRAPPER_TEMPLATES; do
              cp "${TEMPLATES_DIR}/${TMPL}" "${TMPL}" || return 1
              [ "${TMPL}" != "z.ps1" ] && { chmod +x "${TMPL}" || return 1; }
              if ! git diff --quiet -- "${TMPL}" || \
                 ! git ls-files --error-unmatch "${TMPL}" >/dev/null 2>&1; then
                git add "${TMPL}"
                CHANGED=1
              fi
            done

            if [ "$CHANGED" -eq 0 ]; then
              echo "$REPO already up to date."
              SKIPPED_REPOS+=("$REPO")
              return 0
            fi

            # Create or reset the automation branch and commit.
            git checkout -B "$BRANCH"
            git commit -m "$COMMIT_MSG"

            # Push using a one-off authenticated URL to avoid
            # persisting the token in .git/config.
            git push "https://x-access-token:${DISPATCH_TOKEN}@github.com/${REPO}.git" \
              "$BRANCH" --force 2>&1 || return 1

            # Open or refresh a PR.
            local PR_TITLE="[ci] Sync zutils ${LATEST_TAG}"
            local PR_BODY
            printf -v PR_BODY "%s\n%s\n%s\n\n%s" \
              "Automated sync with [\`${LATEST_TAG}\`](https://github.com/nanvix/zutils/releases/tag/${LATEST_TAG}):" \
              "- Bumps \`zutil-version\` in caller workflows." \
              "- Copies bootstrapper templates (\`z\`, \`z.sh\`, \`z.ps1\`) from release assets." \
              "Generated by the [Update Zutils](https://github.com/nanvix/workflows/actions/workflows/nanvix-update-zutils.yml) workflow."

            local EXISTING_PR
            EXISTING_PR=$(gh pr list \
              --repo "$REPO" \
              --head "$BRANCH" \
              --base "$DEFAULT_BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty' 2>/dev/null || true)

            local NEW_PR=""
            if [ -n "$EXISTING_PR" ]; then
              gh pr edit "$EXISTING_PR" \
                --repo "$REPO" \
                --title "$PR_TITLE" \
                --body "$PR_BODY"
              echo "Updated existing PR #$EXISTING_PR on $REPO."
            else
              local PR_URL
              PR_URL=$(gh pr create \
                --repo "$REPO" \
                --title "$PR_TITLE" \
                --body "$PR_BODY" \
                --base "$DEFAULT_BRANCH" \
                --head "$BRANCH") || return 1

              NEW_PR="${PR_URL##*/}"
              echo "Opened PR #$NEW_PR on $REPO."
            fi

            # Best-effort assignment.
            local LATEST_PR="${EXISTING_PR:-$NEW_PR}"
            if [ -n "${LATEST_PR:-}" ] && [ -n "$ASSIGNEE" ]; then
              gh pr edit "$LATEST_PR" --repo "$REPO" \
                --add-assignee "$ASSIGNEE" \
                --add-reviewer "$ASSIGNEE" 2>/dev/null || true
            fi

            UPDATED_REPOS+=("$REPO")
          }

          for REPO in $(echo "$TARGET_REPOS" | jq -r '.[]'); do
            echo "::group::$REPO"
            REPO_DIR="$WORK_DIR/$(echo "$REPO" | tr '/' '-')"

            if ! update_repo "$REPO" "$REPO_DIR"; then
              echo "::warning::Failed to process $REPO; skipping."
              FAILED_REPOS+=("$REPO")
            fi

            echo "::endgroup::"
          done

          rm -rf "$WORK_DIR"

          # Step summary.
          {
            echo "## Update Zutils Version"
            echo ""
            echo "**Target tag:** \`$LATEST_TAG\`"

            if [ "${#UPDATED_REPOS[@]}" -gt 0 ]; then
              echo ""
              echo "### PRs opened or updated"
              for R in "${UPDATED_REPOS[@]}"; do echo "- $R"; done
            fi

            if [ "${#SKIPPED_REPOS[@]}" -gt 0 ]; then
              echo ""
              echo "### Already up to date"
              for R in "${SKIPPED_REPOS[@]}"; do echo "- $R"; done
            fi

            if [ "${#FAILED_REPOS[@]}" -gt 0 ]; then
              echo ""
              echo "### Failed"
              for R in "${FAILED_REPOS[@]}"; do echo "- $R"; done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
