# This workflow syncs consumer repositories with the latest nanvix/zutils
# release. It runs on a tiered daily schedule (09:00–14:00 UTC) that
# mirrors the consumer CI cascade, can be triggered manually via
# workflow_dispatch, or called from another workflow (e.g. the zutils
# release pipeline) via workflow_call with an explicit tag.
# It resolves the latest release tag of nanvix/zutils (unless one is
# provided), then iterates over each target repo:
#   1. Writing the resolved tag to `.zutils-version` at the repo root.
#      This is the source of truth for consumers on workflows@v2.1.0+,
#      where the reusable `nanvix-ci.yml` reads the file
#   2. Copying bootstrapper templates (z, z.sh, z.ps1) from the
#      release's templates.tar.gz asset to the repo root.
# A pull request is opened (or refreshed) when changes are detected.

name: Update Zutils Version

on:
  schedule:
    # Tier-to-repo mapping lives in tier-config.json.
    - cron: "0 9 * * *" # Tier 1
    - cron: "0 10 * * *" # Tier 2
    - cron: "0 11 * * *" # Tier 3
    - cron: "0 12 * * *" # Tier 4
    - cron: "0 13 * * *" # Tier 5
    - cron: "0 14 * * *" # Tier 6
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Zutils release tag to sync (e.g. v0.6.0). Resolved from latest release if omitted."
        required: false
        type: string
    secrets:
      DISPATCH_TOKEN:
        description: "PAT with repo scope for cloning/pushing to consumer repos"
        required: true

permissions:
  contents: read

concurrency:
  group: >-
    update-zutils-${{
      github.event.schedule == '0 9 * * *' && 'tier1' ||
      github.event.schedule == '0 10 * * *' && 'tier2' ||
      github.event.schedule == '0 11 * * *' && 'tier3' ||
      github.event.schedule == '0 12 * * *' && 'tier4' ||
      github.event.schedule == '0 13 * * *' && 'tier5' ||
      github.event.schedule == '0 14 * * *' && 'tier6' ||
      'all'
    }}
  cancel-in-progress: true

jobs:
  update-zutils:
    name: Update zutils version
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      ASSIGNEE: ppenna
      BOOTSTRAPPER_TEMPLATES: "z z.sh z.ps1"
    steps:
      - name: Checkout workflows repo
        uses: actions/checkout@v7
        with:
          repository: nanvix/workflows
          # No explicit ref — actions/checkout uses the default branch
          # for cross-repo checkouts (workflow_call from zutils) and
          # github.sha for same-repo runs (schedule/dispatch).
          # Both github.sha and github.workflow_sha refer to the
          # *caller's* repo in a workflow_call context, so any explicit
          # ref would try to fetch a zutils SHA from this repo and fail.

      - name: Resolve latest zutils release tag
        id: latest
        env:
          TAG_INPUT: ${{ inputs.tag || '' }}
        run: |
          set -euo pipefail
          TAG="$TAG_INPUT"
          if [ -z "$TAG" ]; then
            TAG=$(gh api repos/nanvix/zutils/releases/latest --jq '.tag_name')
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Could not resolve latest release tag for nanvix/zutils"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved latest zutils tag: $TAG"

          REPOS=$(jq -c '.' consumer-repos.json)
          echo "default_repos=$REPOS" >> "$GITHUB_OUTPUT"

      - name: Select target repos
        id: select-repos
        env:
          DEFAULT_REPOS: ${{ steps.latest.outputs.default_repos }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
        run: bash scripts/select-tier-repos.sh

      - name: Download bootstrapper templates
        id: templates
        run: |
          set -euo pipefail
          DIR="$(mktemp -d)"
          gh release download "${{ steps.latest.outputs.tag }}" \
            --repo nanvix/zutils \
            --pattern "templates.tar.gz" \
            --dir "$DIR"
          tar xzf "$DIR/templates.tar.gz" -C "$DIR"
          rm "$DIR/templates.tar.gz"

          # Verify that all expected bootstrapper templates are present.
          for TMPL in $BOOTSTRAPPER_TEMPLATES; do
            if [ ! -f "$DIR/$TMPL" ]; then
              echo "::error::Expected template '$TMPL' not found in templates.tar.gz"
              exit 1
            fi
          done

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Extracted bootstrapper templates:"
          ls -la "$DIR"

      - name: Update target repositories
        env:
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
          TARGET_REPOS: ${{ steps.select-repos.outputs.repos }}
          TEMPLATES_DIR: ${{ steps.templates.outputs.dir }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: bash scripts/update-zutils.sh
