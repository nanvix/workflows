# This workflow bumps the nanvix/workflows version reference in consumer fork
# repositories. It resolves the highest semver tag of this repository, then
# iterates over each target repo, updating any
# `uses: nanvix/workflows/...@vOLD` references to `@vLATEST` and opening (or
# refreshing) a pull request when changes are detected.

name: Update Workflow Refs

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-workflow-refs
  cancel-in-progress: true

jobs:
  update-refs:
    name: Update workflow refs
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      ASSIGNEE: ppenna
    steps:
      - name: Checkout workflows repo
        uses: actions/checkout@v5

      - name: Resolve highest semver tag
        id: latest
        run: |
          set -euo pipefail

          # Use the highest semver tag instead of /releases/latest, which
          # returns the most recently *published* release and can regress
          # if a tag exists without a corresponding release (e.g. v1.5.0
          # is tagged but never published as a GitHub Release, so the
          # endpoint falls back to the older v1.4.0).
          TAG=$(gh api repos/nanvix/workflows/tags --paginate --jq '.[].name' \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | sort -V \
            | tail -1)
          if [ -z "$TAG" ]; then
            echo "::error::Could not resolve latest semver tag for nanvix/workflows"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved latest tag: $TAG"

          REPOS=$(jq -c '.' consumer-repos.json)
          echo "default_repos=$REPOS" >> "$GITHUB_OUTPUT"

      - name: Update target repositories
        env:
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
          TARGET_REPOS: ${{ steps.latest.outputs.default_repos }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail

          WORK_DIR="$(mktemp -d)"
          BRANCH="automation/update-nanvix-workflows"
          COMMIT_MSG="[ci] E: Update nanvix workflow refs to ${LATEST_TAG}"

          declare -a UPDATED_ITEMS=()
          declare -a SKIPPED_REPOS=()
          declare -a FAILED_REPOS=()

          # Process a single consumer repo. Returns 0 on success, 1 on failure.
          update_repo() {
            local REPO="$1"
            local REPO_DIR="$2"

            # Clone only the default branch (shallow).
            gh repo clone "$REPO" "$REPO_DIR" -- --depth 1 2>&1

            pushd "$REPO_DIR" >/dev/null

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            local DEFAULT_BRANCH
            DEFAULT_BRANCH=$(gh repo view "$REPO" --json defaultBranchRef --jq '.defaultBranchRef.name')
            echo "Default branch: $DEFAULT_BRANCH"

            # Find and update all nanvix/workflows version references.
            local CHANGED=0
            local FILE
            for FILE in .github/workflows/*.yml .github/workflows/*.yaml; do
              [ -f "$FILE" ] || continue
              if grep -qE 'uses:[[:space:]]*nanvix/workflows/.+@v[^[:space:]#]+' "$FILE"; then
                sed -i -E "s|(uses:[[:space:]]*nanvix/workflows/.+)@v[^[:space:]#]+|\1@${LATEST_TAG}|g" "$FILE"

                # Inject caller-head-repo input if not already present.
                # Required by the auto-merge job in the reusable workflow
                # for fork protection (v1.7.1+).
                if grep -q 'caller-event-name:' "$FILE" && ! grep -q 'caller-head-repo:' "$FILE"; then
                  sed -i '/caller-event-name:/a\      caller-head-repo: ${{ github.event.pull_request.head.repo.full_name || '\'''\'' }}' "$FILE"
                fi

                if ! git diff --quiet -- "$FILE"; then
                  git add "$FILE"
                  CHANGED=1
                fi
              fi
            done

            if [ "$CHANGED" -eq 0 ]; then
              echo "$REPO already up to date."
              SKIPPED_REPOS+=("$REPO")
              popd >/dev/null
              return 0
            fi

            # Create or reset the automation branch and commit.
            git checkout -B "$BRANCH"
            git commit -m "$COMMIT_MSG"

            # Ensure git push uses DISPATCH_TOKEN credentials for this repo.
            git remote set-url origin "https://x-access-token:${DISPATCH_TOKEN}@github.com/${REPO}.git"
            git push origin "$BRANCH" --force 2>&1

            # Open or refresh a PR.
            local PR_TITLE="[ci] E: Update nanvix workflow refs to ${LATEST_TAG}"
            local PR_BODY="Automated bump of \`nanvix/workflows\` references to [\`${LATEST_TAG}\`](https://github.com/nanvix/workflows/releases/tag/${LATEST_TAG}).

          Generated by the [Update Workflow Refs](https://github.com/nanvix/workflows/actions/workflows/nanvix-update-workflows.yml) workflow."

            local EXISTING_PR
            EXISTING_PR=$(gh pr list \
              --repo "$REPO" \
              --head "$BRANCH" \
              --base "$DEFAULT_BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty' 2>/dev/null || true)

            local NEW_PR=""
            if [ -n "$EXISTING_PR" ]; then
              gh pr edit "$EXISTING_PR" \
                --repo "$REPO" \
                --title "$PR_TITLE" \
                --body "$PR_BODY"
              echo "Updated existing PR #$EXISTING_PR on $REPO."
            else
              local PR_URL
              PR_URL=$(gh pr create \
                --repo "$REPO" \
                --title "$PR_TITLE" \
                --body "$PR_BODY" \
                --base "$DEFAULT_BRANCH" \
                --head "$BRANCH")

              NEW_PR="${PR_URL##*/}"
              echo "Opened PR #$NEW_PR on $REPO."
            fi

            # Best-effort assignment.
            local LATEST_PR="${EXISTING_PR:-$NEW_PR}"
            if [ -n "${LATEST_PR:-}" ] && [ -n "$ASSIGNEE" ]; then
              gh pr edit "$LATEST_PR" --repo "$REPO" \
                --add-assignee "$ASSIGNEE" \
                --add-reviewer "$ASSIGNEE" 2>/dev/null || true
            fi

            UPDATED_ITEMS+=("${REPO} — https://github.com/${REPO}/pull/${LATEST_PR}")
            popd >/dev/null
          }

          for REPO in $(echo "$TARGET_REPOS" | jq -r '.[]'); do
            echo "::group::$REPO"
            REPO_DIR="$WORK_DIR/$(echo "$REPO" | tr '/' '-')"

            if ! update_repo "$REPO" "$REPO_DIR"; then
              echo "::warning::Failed to process $REPO; skipping."
              FAILED_REPOS+=("$REPO")
            fi

            echo "::endgroup::"
          done

          rm -rf "$WORK_DIR"

          # Step summary.
          {
            echo "## Update Workflow Refs"
            echo ""
            echo "**Target tag:** \`$LATEST_TAG\`"

            if [ "${#UPDATED_ITEMS[@]}" -gt 0 ]; then
              echo ""
              echo "### PRs opened or updated"
              for R in "${UPDATED_ITEMS[@]}"; do echo "- $R"; done
            fi

            if [ "${#SKIPPED_REPOS[@]}" -gt 0 ]; then
              echo ""
              echo "### Already up to date"
              for R in "${SKIPPED_REPOS[@]}"; do echo "- $R"; done
            fi

            if [ "${#FAILED_REPOS[@]}" -gt 0 ]; then
              echo ""
              echo "### Failed"
              for R in "${FAILED_REPOS[@]}"; do echo "- $R"; done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
