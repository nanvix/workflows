# Reusable workflow that refreshes patched Rust crates and opens an automated PR.

name: Update Rust Dependencies

on:
  workflow_call:
    inputs:
      base-branch:
        description: Branch to target when opening the dependency update PR.
        required: false
        type: string
        default: main
      commit-message:
        description: Commit message used for the automation branch.
        required: false
        type: string
        default: Update Nanvix Dependencies
      pr-title:
        description: Title for the generated pull request.
        required: false
        type: string
        default: Update Nanvix Dependencies
      pr-branch:
        description: Branch name to push dependency updates to.
        required: false
        type: string
        default: automation/update-nanvix-dependencies
      labels:
        description: Comma-separated list of labels to apply to the pull request.
        required: false
        type: string
        default: enhancement
      reviewers:
        description: Comma-separated list of reviewers.
        required: false
        type: string
        default: ppenna
      assignees:
        description: Comma-separated list of assignees.
        required: false
        type: string
        default: ppenna
    secrets:
      automation-token:
        description: Token with contents and pull_request write permissions.
        required: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Discover Patched Crates
        id: patched-crates
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import sys

          import tomllib

          config_path = pathlib.Path('.cargo/config.toml')
          if not config_path.exists():
              print('No .cargo/config.toml found; skipping dependency refresh.')
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
                  fh.write('specs=\n')
              raise SystemExit(0)
          data = tomllib.loads(config_path.read_text(encoding='utf-8'))
          patches = data.get('patch', {}).get('crates-io', {})
          if not patches:
              raise SystemExit('No patched crates found in .cargo/config.toml')

          specs = []
          bullet_lines = []
          for name in sorted(patches):
              entry = patches.get(name) or {}
              branch = str(entry.get('branch', ''))
              version_token = branch.rsplit('/', 1)[-1] if branch else ''
              if version_token.startswith('v'):
                  version_token = version_token[1:]

              if not version_token:
                  print(
                      f"Warning: Could not derive version for {name} from branch '{branch}'",
                      file=sys.stderr,
                  )
                  continue

              specs.append(f"{name}@{version_token}")
              bullet_lines.append(f"- {name}")

          if not specs:
              raise SystemExit('No dependency specs could be derived from patches')

          body_path = pathlib.Path('/tmp/patched-pr-body.md')
          body_text = '\n'.join(
              ['Automated cargo updates for Nanvix dependencies:']
              + bullet_lines
              + ['', 'This PR was generated by the update-nanvix-dependencies workflow.']
          )
          body_path.write_text(body_text + '\n', encoding='utf-8')

          specs_str = ' '.join(specs)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"specs={specs_str}\n")
              fh.write(f"body_path={body_path}\n")
          PY

      - name: Update Patched Crates
        if: ${{ steps.patched-crates.outputs.specs != '' }}
        env:
          PATCHED_SPECS: ${{ steps.patched-crates.outputs.specs }}
        run: |
          set -euo pipefail
          for spec in $PATCHED_SPECS; do
            echo "Updating $spec…"
            cargo update -p "$spec"
          done

      - name: Open Pull Request
        if: ${{ steps.patched-crates.outputs.specs != '' }}
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.automation-token }}
          base: ${{ inputs.base-branch }}
          commit-message: ${{ inputs.commit-message }}
          title: ${{ inputs.pr-title }}
          body-path: ${{ steps.patched-crates.outputs.body_path }}
          labels: ${{ inputs.labels }}
          reviewers: ${{ inputs.reviewers }}
          assignees: ${{ inputs.assignees }}
          branch: ${{ inputs.pr-branch }}
          delete-branch: false
