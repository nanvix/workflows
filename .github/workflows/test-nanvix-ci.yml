# Test caller for the reusable nanvix-ci workflow.
# Trigger manually via workflow_dispatch to validate changes to the
# reusable workflow before merging. Uses a minimal matrix to keep
# runtime short.

name: Test Nanvix CI

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: JSON array of target platforms (default is minimal).
        required: false
        default: '["microvm"]'
        type: string
      process-modes:
        description: JSON array of deployment modes (default is minimal).
        required: false
        default: '["single-process"]'
        type: string
      benchmark:
        description: Enable benchmark job in reusable workflow.
        required: false
        default: false
        type: boolean
      benchmark-args:
        description: >
          (Deprecated) Whitespace-separated benchmark args passed through
          to reusable workflow.
        required: false
        default: ""
        type: string
      benchmark-args-json:
        description: JSON array of benchmark args passed through to reusable workflow.
        required: false
        default: "[]"
        type: string

permissions:
  contents: write
  actions: read

jobs:
  ci:
    uses: ./.github/workflows/nanvix-ci.yml
    with:
      platforms: ${{ inputs.platforms }}
      process-modes: ${{ inputs.process-modes }}
      memory-sizes: '["256mb"]'
      benchmark: ${{ inputs.benchmark }}
      benchmark-args: ${{ inputs.benchmark-args }}
      benchmark-args-json: ${{ inputs.benchmark-args-json }}
      caller-event-name: ${{ github.event_name }}
      # yamllint disable-line rule:line-length
      docker-image: "ghcr.io/nanvix/nanvix-sdk-c-clang@sha256:880ed7e6a20fe9bf2536b1b3ba9bdbbd067a48f043ec9131d3dd398c65f11f35"
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
