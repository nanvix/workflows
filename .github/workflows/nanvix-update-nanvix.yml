name: Update Nanvix SDK

on:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      sdk-tag:
        description: Verified nanvix/sdk GitHub Release tag; latest when empty.
        required: false
        type: string
      zutils-ref:
        description: Command-capable nanvix/zutils ref.
        required: false
        default: v0.15.0
        type: string
  repository_dispatch:
    types: [nanvix-sdk-released]

permissions:
  contents: read
  actions: write

concurrency:
  group: update-nanvix-${{ github.event.schedule || 'all' }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      contract: ${{ steps.sdk.outputs.contract }}
      idempotency_key: ${{ steps.sdk.outputs.idempotency_key }}
      repos: ${{ steps.select.outputs.repos }}
      sdk_version: ${{ steps.sdk.outputs.sdk_version }}
      tier: ${{ steps.select.outputs.tier }}
      zutils_ref: ${{ steps.zutils.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate registry and select consumers
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          UPDATER: nanvix
        run: scripts/select-tier-repos.sh

      - name: Resolve verified SDK release contract
        id: sdk
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_DISPATCH_CONTRACT: ${{ toJSON(github.event.client_payload.contract) }}
          SDK_IDEMPOTENCY_KEY: ${{ github.event.client_payload.idempotency_key || '' }}
          SDK_TAG: ${{ inputs.sdk-tag || '' }}
        run: |
          if [ "$SDK_DISPATCH_CONTRACT" = "null" ]; then
            SDK_DISPATCH_CONTRACT=""
          fi
          export SDK_DISPATCH_CONTRACT
          scripts/resolve-sdk-contract.sh

      - name: Select zutils implementation
        id: zutils
        env:
          INPUT_REF: ${{ inputs.zutils-ref || '' }}
          CONFIGURED_REF: ${{ vars.ZUTILS_UPDATE_VERSION || 'v0.15.0' }}
        run: echo "ref=${INPUT_REF:-$CONFIGURED_REF}" >> "$GITHUB_OUTPUT"

  mutate:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      artifact_paths: ${{ steps.mutate.outputs.artifact_paths }}
      bundle_digests: ${{ steps.mutate.outputs.bundle_digests }}
      failed: ${{ steps.mutate.outputs.failed }}
      patch_digests: ${{ steps.mutate.outputs.patch_digests }}
      publication_repos: ${{ steps.mutate.outputs.publication_repos }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout target zutils implementation
        uses: actions/checkout@v7
        with:
          repository: nanvix/zutils
          ref: ${{ needs.prepare.outputs.zutils_ref }}
          path: zutils-source
          persist-credentials: false

      - name: Install target zutils
        run: python3 -m pip install ./zutils-source

      - name: Mutate read-only consumer clones
        id: mutate
        env:
          CONTRACT_B64: ${{ needs.prepare.outputs.contract }}
          REPOS: ${{ needs.prepare.outputs.repos }}
        run: |
          set -euo pipefail
          printf '%s' "$CONTRACT_B64" | base64 -d > sdk-release.json
          docker pull "$(jq -r '.image.ref' sdk-release.json)"
          mkdir -p mutation publication
          digests='{}'
          bundle_digests='{}'
          paths='{}'
          publications='[]'
          failed='[]'

          while IFS= read -r repo; do
            slug="${repo//\//--}"
            clone="mutation/$slug"
            echo "::group::$repo"
            if ! git clone --depth=1 "https://github.com/$repo.git" "$clone"; then
              failed=$(jq -c --arg repo "$repo" '. + [$repo]' <<< "$failed")
              echo "::warning::Failed to clone $repo"
              echo "::endgroup::"
              continue
            fi

            output="$GITHUB_WORKSPACE/mutation/$slug.output"
            : > "$output"
            if (
              cd "$clone"
              GITHUB_OUTPUT="$output" \
                UPDATE_KIND=nanvix \
                UPDATE_TARGET="$GITHUB_WORKSPACE/sdk-release.json" \
                TARGET_REPO="$repo" \
                ARTIFACT_DIR="$GITHUB_WORKSPACE/publication/$slug" \
                "$GITHUB_WORKSPACE/scripts/create-update-artifact.sh"
            ); then
              status=$(sed -n 's/^status=//p' "$output")
              case "$status" in
                updated)
                  digest=$(sed -n 's/^patch_sha256=//p' "$output")
                  bundle_digest=$(sed -n 's/^bundle_sha256=//p' "$output")
                  digests=$(jq -c --arg repo "$repo" --arg value "$digest" \
                    '. + {($repo): $value}' <<< "$digests")
                  bundle_digests=$(jq -c \
                    --arg repo "$repo" --arg value "$bundle_digest" \
                    '. + {($repo): $value}' <<< "$bundle_digests")
                  paths=$(jq -c --arg repo "$repo" --arg value "$slug" \
                    '. + {($repo): $value}' <<< "$paths")
                  publications=$(jq -c --arg repo "$repo" '. + [$repo]' \
                    <<< "$publications")
                  echo "- $repo" >> mutation/updated
                  ;;
                current) echo "- $repo" >> mutation/current ;;
                blocked) echo "- $repo" >> mutation/blocked ;;
                *)
                  failed=$(jq -c --arg repo "$repo" '. + [$repo]' <<< "$failed")
                  echo "::warning::$repo returned no mutation status"
                  ;;
              esac
            else
              failed=$(jq -c --arg repo "$repo" '. + [$repo]' <<< "$failed")
              echo "::warning::Mutation failed for $repo"
            fi
            rm -rf "$clone"
            echo "::endgroup::"
          done < <(jq -r '.[]' <<< "$REPOS")

          {
            echo "patch_digests=$digests"
            echo "bundle_digests=$bundle_digests"
            echo "artifact_paths=$paths"
            echo "publication_repos=$publications"
            echo "failed=$failed"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Nanvix SDK consumer updates"
            echo ""
            echo "**SDK:** \`${{ needs.prepare.outputs.sdk_version }}\`"
            for category in updated current blocked; do
              echo ""
              echo "### ${category^}"
              if [ -s "mutation/$category" ]; then
                cat "mutation/$category"
              else
                echo "_None_"
              fi
            done
            echo ""
            echo "### Failed"
            jq -r '.[] | "- " + .' <<< "$failed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload publication patches
        if: steps.mutate.outputs.publication_repos != '[]'
        uses: actions/upload-artifact@v7
        with:
          name: nanvix-updates-${{ github.run_id }}
          path: publication
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, mutate]
    if: needs.mutate.outputs.publication_repos != '[]'
    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJSON(needs.mutate.outputs.publication_repos) }}
    uses: ./.github/workflows/publish-update.yml
    with:
      app-id: ${{ vars.CONSUMER_UPDATE_APP_ID }}
      artifact: nanvix-updates-${{ github.run_id }}
      artifact-path: ${{ fromJSON(needs.mutate.outputs.artifact_paths)[matrix.repository] }}
      update-kind: nanvix
      body: >-
        Automated coherent update to verified Nanvix SDK
        `${{ needs.prepare.outputs.sdk_version }}`. The manifest and lockfile
        were generated atomically by the target zutils implementation.
      branch: automation/update-nanvix-version
      expected-bundle-sha256: ${{ fromJSON(needs.mutate.outputs.bundle_digests)[matrix.repository] }}
      expected-patch-sha256: ${{ fromJSON(needs.mutate.outputs.patch_digests)[matrix.repository] }}
      repository: ${{ matrix.repository }}
      title: "[ci] E: Update Nanvix SDK"
    secrets:
      app-private-key: ${{ secrets.CONSUMER_UPDATE_APP_PRIVATE_KEY }}
      dispatch-token: ${{ secrets.DISPATCH_TOKEN }}

  report:
    needs: [mutate, publish]
    if: always() && needs.mutate.outputs.failed != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Fail after publishing valid independent updates
        env:
          FAILED: ${{ needs.mutate.outputs.failed }}
        run: |
          echo "::error::Consumer mutations failed: $FAILED"
          exit 1
