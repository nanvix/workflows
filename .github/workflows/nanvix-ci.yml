# Reusable CI workflow for Nanvix library ports (zlib, bzip2, etc.).
# Consumer repos invoke this via a thin caller workflow that supplies
# repo-specific values through inputs and secrets.

name: Nanvix CI

on:
  workflow_call:
    inputs:
      platforms:
        description: JSON array of target platforms.
        required: false
        default: '["microvm"]'
        type: string
      target-archs:
        description: JSON array of target architectures.
        required: false
        default: '["x86"]'
        type: string
      process-modes:
        description: JSON array of deployment modes.
        required: false
        default: '["multi-process","single-process","standalone"]'
        type: string
      memory-sizes:
        description: JSON array of memory configurations.
        required: false
        default: '["128mb"]'
        type: string
      hosts:
        description: JSON array of target hosts.
        required: false
        default: '["linux", "windows"]'
        type: string
      matrix-exclude:
        description: >
          JSON array of {platform, process-mode} objects to exclude from the
          build matrix. Example: [{"platform":"hyperlight","process-mode":"single-process"}]
        required: false
        default: "[]"
        type: string
      standalone-test-args:
        description: Extra args passed to ./z test -- for modes in skip-full-test-modes.
        required: false
        default: "test-smoke test-integration"
        type: string
      skip-full-test-modes:
        description: JSON array of modes that skip the full ./z test and use standalone-test-args instead.
        required: false
        default: '["standalone"]'
        type: string
      downstream-dispatches:
        description: >
          JSON array of {repo, event_type} objects. Each entry triggers a
          repository_dispatch on the target repo after a successful release.
        required: false
        default: "[]"
        type: string
      caller-event-name:
        description: >
          github.event_name from the caller workflow. Required because the
          reusable workflow always sees "workflow_call".
        required: true
        type: string
      release-notes-extra:
        description: Extra markdown to append to the release notes.
        required: false
        default: ""
        type: string
      failure-assignees:
        description: >
          Comma-separated GitHub usernames to assign on CI failure issues.
          Replaces dynamic admin resolution which requires elevated token
          permissions not available via GITHUB_TOKEN.
        required: false
        default: "ppenna"
        type: string
      failure-notify-team:
        description: >
          Org team slug to @-mention on CI failure issues (e.g. "admin").
          The team is mentioned as @<org>/<slug> so all members are notified.
          Set to empty string to disable team mentions.
        required: false
        default: "admin"
        type: string
      windows-test:
        description: >
          Run a Windows test job after the Linux build. Delegates to
          nanvix-zutil setup + test (and optionally build). Only runs
          when the process-modes input includes "standalone" (required
          for Windows — multi-process needs linuxd which is Linux-only).
        required: false
        default: true
        type: boolean
      benchmark:
        description: Enable benchmark job after build (nanvix-zutil setup + benchmark).
        required: false
        default: false
        type: boolean
      benchmark-args:
        description: >
          (Deprecated) Whitespace-separated extra args passed to
          nanvix-zutil benchmark --. Quoting/escaping is not preserved.
        required: false
        default: ""
        type: string
      benchmark-args-json:
        description: >
          JSON array of extra benchmark arguments passed to
          nanvix-zutil benchmark -- preserving spaces and quoting.
          Example: '["hello-world","--case","name with spaces"]'
        required: false
        default: "[]"
        type: string
      benchmark-matrix-exclude:
        description: JSON array of matrix entries to exclude from the benchmark matrix.
        required: false
        default: "[]"
        type: string
      windows-build:
        description: >
          Build on Windows via Docker Desktop before testing. Requires a
          self-hosted runner with Docker Desktop (see windows-runner).
          When false (default), Windows tests use ELF binaries built by
          the Linux build job, transferred via GitHub Actions artifacts.
        required: false
        default: false
        type: boolean
      windows-release:
        description: >
          Publish a release targeting Windows by replacing nanvix ELF binaries
          with windows EXEs.
        required: false
        default: false
        type: boolean
      windows-matrix-exclude:
        description: >
          JSON array of {platform, memory} objects to exclude from the
          Windows test matrix. Example: [{"platform":"hyperlight","memory":"256mb"}]
        required: false
        default: "[]"
        type: string
      windows-runner:
        description: >
          Runner label(s) for Windows jobs. Use a JSON string for
          self-hosted runners with Docker Desktop (e.g.
          '["self-hosted","Windows"]'). Default: '"windows-latest"'.
        required: false
        default: '"windows-latest"'
        type: string
      python-paths:
        description: >
          Space-separated Python paths to format-check with black.
          Set to empty string to skip Python format/lint checks.
        required: false
        type: string
        default: ".nanvix/z.py"
      shell-paths:
        description: >
          Space-separated shell script paths to check with shfmt and shellcheck.
          Set to empty string to skip shell checks.
        required: false
        type: string
        default: "z z.sh"
      yaml-paths:
        description: >
          Space-separated YAML file or directory paths to lint with yamllint.
          Defaults to the nanvix-ci workflow file only.
        required: false
        type: string
        default: ".github/workflows/nanvix-ci.yml"
      dist-path:
        description: >
          Output path for distribution artifacts.
        required: false
        type: string
        default: ".nanvix/out/dist"
      test-output-path:
        description: >
          Test build output path. Should capture _only_ what is required for
          zutils test() lifecycle to run on its own. Combines with
          test-output-globs to further filter the input.
        required: false
        type: string
        default: ".nanvix/out/test"
      test-output-globs:
        description: >
          JSON array of strings describing output files to tarball and bring to
          Windows. These globs will be prefixed with `test-output-path` when
          sending artifacts to Windows.
        required: false
        type: string
        default: '["**/*.elf", "**/*.so"]'
      use-release-sha:
        description: >
          If true, the release job will append a SHA to the release tag.
        required: false
        type: boolean
        default: false

    secrets:
      GH_TOKEN:
        description: >
          Token with repo read access for zutil and artifact downloads and
          write access when publishing releases or failure issues.
        required: false
      DISPATCH_TOKEN:
        description: >
          Token with repo scope and admin access on consumer repos.
          Used for downstream dispatches and guarded automation PR auto-merge.
        required: true
    outputs:
      package_name:
        description: Package name resolved from the manifest.
        value: ${{ jobs.get-nanvix-info.outputs.package_name }}
      package_version:
        description: Package version resolved from the manifest.
        value: ${{ jobs.get-nanvix-info.outputs.package_version }}
      nanvix_version:
        description: Nanvix version resolved from the manifest.
        value: ${{ jobs.get-nanvix-info.outputs.nanvix_version }}
      nanvix_tag:
        description: Nanvix release tag.
        value: ${{ jobs.get-nanvix-info.outputs.nanvix_tag }}
      nanvix_sha:
        description: Nanvix commit SHA.
        value: ${{ jobs.get-nanvix-info.outputs.nanvix_sha }}
      sdk_version:
        description: Verified SDK release version.
        value: ${{ jobs.get-nanvix-info.outputs.sdk_version }}
      sdk_image_ref:
        description: Immutable SDK provider image reference.
        value: ${{ jobs.get-nanvix-info.outputs.sdk_image_ref }}
      release_tag:
        description: Tag for the release created in this job, if applicable.
        value: ${{ jobs.release.outputs.release_tag }}

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write
  packages: read

jobs:
  # -------------------------------------------------------------------
  # Resolve effective nanvix-zutil version
  # -------------------------------------------------------------------
  resolve-zutil-version:
    name: Resolve zutil version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: resolve
        run: |
          set -euo pipefail
          if [ -f .zutils-version ]; then
            VERSION="$(tr -d '[:space:]' < .zutils-version)"
            if [ -z "$VERSION" ]; then
              echo "::error::.zutils-version exists but is empty"
              exit 1
            fi
            echo "Using zutil-version from .zutils-version: $VERSION"
          else
            echo "::error::No .zutils-version file found at repo root"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][[:alnum:].-]+)?$ ]]; then
            echo "::error::Invalid zutil version format: '$VERSION' (expected vX.Y.Z)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------
  # Format & Lint — Python, shell, and YAML checks
  # -------------------------------------------------------------------
  format-and-lint:
    name: Format & Lint
    needs: resolve-zutil-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install shfmt
        if: inputs.shell-paths != ''
        run: |
          set -euxo pipefail
          SHFMT_VERSION="v3.13.0"
          SHFMT_SHA256="70aa99784703a8d6569bbf0b1e43e1a91906a4166bf1a79de42050a6d0de7551"
          curl -fsSL "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64" -o /tmp/shfmt
          echo "${SHFMT_SHA256}  /tmp/shfmt" | sha256sum -c -
          sudo install -m 755 /tmp/shfmt /usr/local/bin/shfmt

      - name: Generate lint configs
        run: |
          mkdir -p .nanvix
          cat > .nanvix/black.toml << 'TOML'
          [tool.black]
          line-length = 88
          target-version = ["py312"]
          TOML
          cat > .nanvix/.yamllint.yml << 'YAML'
          extends: default
          rules:
            line-length:
              max: 120
            truthy:
              check-keys: false
            document-start: disable
          YAML
          cat > .nanvix/pyrightconfig.json << 'JSON'
          {
            "pythonVersion": "3.12",
            "typeCheckingMode": "strict",
            "include": ["."],
            "venvPath": ".",
            "venv": "venv"
          }
          JSON

      - name: Bootstrap .nanvix/venv with nanvix-zutil
        if: inputs.python-paths != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-zutil-version.outputs.version }}"
          uv venv .nanvix/venv --python 3.12
          WHEEL_URL=$(gh api "repos/nanvix/zutils/releases/tags/${VERSION}" \
            --jq '.assets[] | select(.name | endswith(".whl")) | .browser_download_url')
          uv pip install --python .nanvix/venv/bin/python "$WHEEL_URL"

      - name: Check Python formatting (black)
        if: inputs.python-paths != ''
        run: uvx black@26.3.1 --check --config .nanvix/black.toml ${{ inputs.python-paths }}

      - name: Type check (pyright)
        if: inputs.python-paths != ''
        run: uvx pyright@1.1.400 --project .nanvix/pyrightconfig.json

      - name: Check shell formatting (shfmt)
        if: inputs.shell-paths != ''
        run: shfmt -d -i 4 -ci ${{ inputs.shell-paths }}

      - name: Lint shell scripts (shellcheck)
        if: inputs.shell-paths != ''
        run: shellcheck ${{ inputs.shell-paths }}

      - name: Lint YAML files (yamllint)
        if: inputs.yaml-paths != ''
        run: uvx yamllint@1.37.0 -c .nanvix/.yamllint.yml ${{ inputs.yaml-paths }}

  # -------------------------------------------------------------------
  # Resolve Nanvix release metadata via nanvix-zutil
  # -------------------------------------------------------------------
  get-nanvix-info:
    name: Get Nanvix Info
    needs: resolve-zutil-version
    runs-on: ubuntu-latest
    outputs:
      nanvix_tag: ${{ steps.resolve.outputs.nanvix_tag }}
      nanvix_sha: ${{ steps.resolve.outputs.nanvix_sha }}
      nanvix_version: ${{ steps.resolve.outputs.nanvix_version }}
      package_name: ${{ steps.resolve.outputs.package_name }}
      package_version: ${{ steps.resolve.outputs.package_version }}
      build_image_ref: ${{ steps.image.outputs.build_image_ref }}
      sdk_c_abi: ${{ steps.resolve.outputs.sdk_c_abi }}
      sdk_digest: ${{ steps.resolve.outputs.sdk_digest }}
      sdk_image: ${{ steps.resolve.outputs.sdk_image }}
      sdk_image_ref: ${{ steps.resolve.outputs.sdk_image_ref }}
      sdk_libc_commit: ${{ steps.resolve.outputs.sdk_libc_commit }}
      sdk_libc_tag: ${{ steps.resolve.outputs.sdk_libc_tag }}
      sdk_provider: ${{ steps.resolve.outputs.sdk_provider }}
      sdk_provider_id: ${{ steps.resolve.outputs.sdk_provider_id }}
      sdk_sysroot_sha256: ${{ steps.resolve.outputs.sdk_sysroot_sha256 }}
      sdk_version: ${{ steps.resolve.outputs.sdk_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install nanvix-zutil
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          NANVIX_ZUTIL_VERSION: ${{ needs.resolve-zutil-version.outputs.version }}
        run: |
          WHEEL_URL=$(gh api repos/nanvix/zutils/releases/tags/"$NANVIX_ZUTIL_VERSION" \
            --jq '.assets[] | select(.name | endswith(".whl")) | .browser_download_url')
          python3 -m pip install "$WHEEL_URL"

      - name: Resolve lockfile and extract release info
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          nanvix-zutil lock --check
          nanvix-zutil resolve >> "$GITHUB_OUTPUT"

      - name: Resolve authoritative build image
        id: image
        env:
          SDK_IMAGE_REF: ${{ steps.resolve.outputs.sdk_image_ref }}
        run: |
          set -euo pipefail
          if [ -z "$SDK_IMAGE_REF" ]; then
            echo "::error::A canonical nanvix-sdk manifest and lockfile are required"
            exit 1
          fi
          BUILD_IMAGE_REF=$(python3 - <<'PY'
          import tomllib

          with open(".nanvix/nanvix.toml", "rb") as manifest_file:
              toolchain = tomllib.load(manifest_file).get("toolchain", {})
          image = toolchain.get("build-image", toolchain.get("sdk-image"))
          digest = toolchain.get("build-digest", toolchain.get("sdk-digest"))
          if not isinstance(image, str) or not isinstance(digest, str):
              raise SystemExit("SDK manifest has no complete effective build image")
          print(f"{image}@{digest}")
          PY
          )
          echo "build_image_ref=$BUILD_IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Verify derived SDK build image
        if: >-
          steps.image.outputs.build_image_ref != steps.resolve.outputs.sdk_image_ref
        env:
          BUILD_IMAGE_REF: ${{ steps.image.outputs.build_image_ref }}
          SDK_DIGEST: ${{ steps.resolve.outputs.sdk_digest }}
          SDK_IMAGE_REF: ${{ steps.resolve.outputs.sdk_image_ref }}
        run: |
          set -euo pipefail
          docker pull "$BUILD_IMAGE_REF"
          mkdir -p "$RUNNER_TEMP/sdk-verification"
          docker run --rm "$SDK_IMAGE_REF" \
            cat /opt/nanvix/nanvix-sdk.json \
            > "$RUNNER_TEMP/sdk-verification/base-manifest.json"
          docker run --rm "$BUILD_IMAGE_REF" \
            cat /opt/nanvix/nanvix-sdk.json \
            > "$RUNNER_TEMP/sdk-verification/build-manifest.json"
          jq -S . "$RUNNER_TEMP/sdk-verification/base-manifest.json" \
            > "$RUNNER_TEMP/sdk-verification/base-manifest.canonical.json"
          jq -S . "$RUNNER_TEMP/sdk-verification/build-manifest.json" \
            > "$RUNNER_TEMP/sdk-verification/build-manifest.canonical.json"
          cmp \
            "$RUNNER_TEMP/sdk-verification/base-manifest.canonical.json" \
            "$RUNNER_TEMP/sdk-verification/build-manifest.canonical.json"
          docker image inspect "$SDK_IMAGE_REF" --format '{{json .Config.Labels}}' \
            > "$RUNNER_TEMP/sdk-verification/base-labels.json"
          docker image inspect "$BUILD_IMAGE_REF" --format '{{json .Config.Labels}}' \
            > "$RUNNER_TEMP/sdk-verification/build-labels.json"
          python3 - "$RUNNER_TEMP/sdk-verification" "$SDK_DIGEST" <<'PY'
          import json
          import pathlib
          import sys

          directory = pathlib.Path(sys.argv[1])
          sdk_digest = sys.argv[2]
          base = json.loads((directory / "base-labels.json").read_text())
          build = json.loads((directory / "build-labels.json").read_text())
          prefix = "dev.nanvix.sdk."
          for key, value in base.items():
              if key.startswith(prefix) and build.get(key) != value:
                  raise SystemExit(f"derived image did not preserve SDK label {key}")
          allowed_extra = f"{prefix}base.digest"
          extras = {
              key for key in build
              if key.startswith(prefix) and key not in base and key != allowed_extra
          }
          if extras:
              raise SystemExit(f"derived image has unknown SDK labels: {sorted(extras)}")
          if build.get(allowed_extra) != sdk_digest:
              raise SystemExit("derived image does not prove its base SDK digest")
          PY

  # -------------------------------------------------------------------
  #  Matrix build — platform × process-mode × memory
  # -------------------------------------------------------------------
  build:
    needs: [resolve-zutil-version, get-nanvix-info]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target-arch: ${{ fromJSON(inputs.target-archs) }}
        platform: ${{ fromJSON(inputs.platforms) }}
        process-mode: ${{ fromJSON(inputs.process-modes) }}
        memory: ${{ fromJSON(inputs.memory-sizes) }}
        exclude: ${{ fromJSON(inputs.matrix-exclude) }}
        host: ${{ fromJSON(inputs.hosts) }}
    name: ${{matrix.host}}-${{ matrix.target-arch }}-${{ matrix.platform }}-${{ matrix.process-mode }}-${{ matrix.memory }}
    defaults:
      run:
        shell: bash
    env:
      NANVIX_VERSION: ${{ needs.get-nanvix-info.outputs.nanvix_tag }}
      NANVIX_DOCKER_IMAGE: ${{ needs.get-nanvix-info.outputs.build_image_ref }}
      NANVIX_SDK_C_ABI: ${{ needs.get-nanvix-info.outputs.sdk_c_abi }}
      NANVIX_SDK_DIGEST: ${{ needs.get-nanvix-info.outputs.sdk_digest }}
      NANVIX_SDK_IMAGE_REF: ${{ needs.get-nanvix-info.outputs.sdk_image_ref }}
      NANVIX_SDK_LIBC_COMMIT: ${{ needs.get-nanvix-info.outputs.sdk_libc_commit }}
      NANVIX_SDK_LIBC_TAG: ${{ needs.get-nanvix-info.outputs.sdk_libc_tag }}
      NANVIX_SDK_PROVIDER: ${{ needs.get-nanvix-info.outputs.sdk_provider }}
      NANVIX_SDK_SYSROOT_SHA256: ${{ needs.get-nanvix-info.outputs.sdk_sysroot_sha256 }}
      NANVIX_SDK_VERSION: ${{ needs.get-nanvix-info.outputs.sdk_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install nanvix-zutil
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          NANVIX_ZUTIL_VERSION: ${{ needs.resolve-zutil-version.outputs.version }}
        run: |
          WHEEL_URL=$(gh api repos/nanvix/zutils/releases/tags/"$NANVIX_ZUTIL_VERSION" \
            --jq '.assets[] | select(.name | endswith(".whl")) | .browser_download_url')
          python3 -m pip install --break-system-packages "$WHEEL_URL"

      - name: Log in to GHCR
        if: startsWith(needs.get-nanvix-info.outputs.build_image_ref, 'ghcr.io/')
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "attempting docker pull (attempt $attempt/5)" >&2
            if docker pull "$NANVIX_DOCKER_IMAGE"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "docker pull failed after 5 attempts" >&2
          exit 1

      - name: Setup (with Docker)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          nanvix-zutil setup \
            --with-docker "$NANVIX_DOCKER_IMAGE" \
            --target "${{ matrix.target-arch }}" \
            --machine "${{ matrix.platform }}" \
            --mode "${{ matrix.process-mode }}" \
            --memory-size "${{ matrix.memory }}" \
            --host "${{ matrix.host }}"

      - name: Build (in Docker)
        run: nanvix-zutil build

      - name: Test
        if: ${{ !contains(fromJSON(inputs.skip-full-test-modes), matrix.process-mode) }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: nanvix-zutil test

      - name: Test (limited)
        if: ${{ contains(fromJSON(inputs.skip-full-test-modes), matrix.process-mode) }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: nanvix-zutil test -- ${{ inputs.standalone-test-args }}

      - name: Release
        if: success()
        run: |
          nanvix-zutil release

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.get-nanvix-info.outputs.package_name }}-${{ needs.get-nanvix-info.outputs.package_version }}-${{ matrix.host }}-${{ matrix.target-arch }}-${{ matrix.platform }}-${{ matrix.process-mode }}-${{ matrix.memory }}
          path: |
            ${{inputs.dist-path}}/*.tar.bz2
            ${{inputs.dist-path}}/*.tar.gz
            ${{inputs.dist-path}}/*.zip
          retention-days: 7

      - name: Expand Windows test upload globs
        id: windows-test-paths
        if: success() && inputs.windows-test && !inputs.windows-build && matrix.process-mode == 'standalone'
        env:
          TEST_OUTPUT_PATH: ${{ inputs.test-output-path }}
          TEST_OUTPUT_GLOBS: ${{ inputs.test-output-globs }}
        run: |
          set -euo pipefail
          paths=""
          while IFS= read -r glob; do
              [ -z "$glob" ] && continue
              paths+="${TEST_OUTPUT_PATH}/${glob}"$'\n'
          done < <(jq -r '.[]' <<< "$TEST_OUTPUT_GLOBS")

          if [[ -z "$paths" ]]; then
              echo "::error::test-output-globs expanded to no paths; set inputs.test-output-globs to a non-empty JSON array"
              exit 1
          fi

          {
              echo 'paths<<EOF'
              printf '%s' "$paths"
              echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Upload build binaries for Windows test
        if: success() && inputs.windows-test && matrix.process-mode == 'standalone'
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-build-${{ matrix.platform }}-${{ matrix.memory }}
          path: ${{ steps.windows-test-paths.outputs.paths }}
          retention-days: 1
          if-no-files-found: warn

      - name: Collect failure logs
        if: failure()
        run: |
          mkdir -p ci-logs
          cp -f /tmp/*.log ci-logs/ 2>/dev/null || true
          find .nanvix -type f -name "*.log" -exec cp -f {} ci-logs/ \; 2>/dev/null || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-logs-${{ matrix.target-arch }}-${{ matrix.platform }}-${{ matrix.process-mode }}-${{ matrix.memory }}
          path: ci-logs/*
          if-no-files-found: warn

  # -------------------------------------------------------------------
  #  Windows smoke test
  #
  # Runs when the process-modes input includes "standalone" (required
  # for Windows — multi-process needs linuxd which is Linux-only).
  # Generic: delegates to the consumer's ./z setup + ./z test, just
  # like the Linux build job.
  # -------------------------------------------------------------------
  windows-test:
    needs: [resolve-zutil-version, get-nanvix-info, build]
    if: >-
      inputs.windows-test
      && contains(fromJSON(inputs.process-modes), 'standalone')
      && !cancelled()
      && needs.build.result == 'success'
    runs-on: ${{ fromJSON(inputs.windows-runner) }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
        memory: ${{ fromJSON(inputs.memory-sizes) }}
        exclude: ${{ fromJSON(inputs.windows-matrix-exclude) }}
    name: windows-test (${{ matrix.platform }}-${{ matrix.memory }})
    env:
      NANVIX_VERSION: ${{ needs.get-nanvix-info.outputs.nanvix_tag }}
      NANVIX_DOCKER_IMAGE: ${{ needs.get-nanvix-info.outputs.build_image_ref }}
      NANVIX_SDK_C_ABI: ${{ needs.get-nanvix-info.outputs.sdk_c_abi }}
      NANVIX_SDK_DIGEST: ${{ needs.get-nanvix-info.outputs.sdk_digest }}
      NANVIX_SDK_IMAGE_REF: ${{ needs.get-nanvix-info.outputs.sdk_image_ref }}
      NANVIX_SDK_LIBC_COMMIT: ${{ needs.get-nanvix-info.outputs.sdk_libc_commit }}
      NANVIX_SDK_LIBC_TAG: ${{ needs.get-nanvix-info.outputs.sdk_libc_tag }}
      NANVIX_SDK_PROVIDER: ${{ needs.get-nanvix-info.outputs.sdk_provider }}
      NANVIX_SDK_SYSROOT_SHA256: ${{ needs.get-nanvix-info.outputs.sdk_sysroot_sha256 }}
      NANVIX_SDK_VERSION: ${{ needs.get-nanvix-info.outputs.sdk_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install nanvix-zutil
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          NANVIX_ZUTIL_VERSION: ${{ needs.resolve-zutil-version.outputs.version }}
        shell: pwsh
        run: |
          $jq = '.assets[] | select(.name | endswith(".whl")) | .browser_download_url'
          $wheel = gh api "repos/nanvix/zutils/releases/tags/$env:NANVIX_ZUTIL_VERSION" --jq $jq
          python -m pip install $wheel

      - name: Setup (downloads Windows host binaries)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        shell: pwsh
        run: |
          nanvix-zutil setup `
            --with-docker "$env:NANVIX_DOCKER_IMAGE" `
            --target "${{ fromJSON(inputs.target-archs)[0] }}" `
            --machine "${{ matrix.platform }}" `
            --mode standalone `
            --memory-size "${{ matrix.memory }}" `
            --host windows

      - name: Download Linux build output
        if: ${{ !inputs.windows-build }}
        uses: actions/download-artifact@v8
        with:
          name: windows-test-build-${{ matrix.platform }}-${{ matrix.memory }}
          path: ${{ inputs.test-output-path }}

      - name: Switch Docker to Linux containers
        if: inputs.windows-build
        shell: pwsh
        run: |
          & 'C:\Program Files\Docker\Docker\DockerCli.exe' -SwitchLinuxEngine
          docker info

      - name: Log in to GHCR
        if: inputs.windows-build && startsWith(needs.get-nanvix-info.outputs.build_image_ref, 'ghcr.io/')
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        if: inputs.windows-build
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            Write-Host "attempting docker pull (attempt $attempt/5)"
            docker pull $env:NANVIX_DOCKER_IMAGE
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds ($attempt * 10)
          }
          Write-Host "docker pull failed after 5 attempts"
          exit 1

      - name: Build (cross-compile via Docker)
        if: inputs.windows-build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        shell: pwsh
        run: nanvix-zutil build

      - name: Test
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        shell: pwsh
        run: nanvix-zutil test

  # -------------------------------------------------------------------
  #  Benchmark (optional)
  # -------------------------------------------------------------------
  benchmark:
    needs: [resolve-zutil-version, get-nanvix-info, build]
    if: >-
      inputs.benchmark
      && !cancelled()
      && needs.build.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target-arch: ${{ fromJSON(inputs.target-archs) }}
        platform: ${{ fromJSON(inputs.platforms) }}
        process-mode: ${{ fromJSON(inputs.process-modes) }}
        memory: ${{ fromJSON(inputs.memory-sizes) }}
        exclude: ${{ fromJSON(inputs.benchmark-matrix-exclude) }}
    name: benchmark (${{ matrix.target-arch }}-${{ matrix.platform }}-${{ matrix.process-mode }}-${{ matrix.memory }})
    defaults:
      run:
        shell: bash
    env:
      NANVIX_VERSION: ${{ needs.get-nanvix-info.outputs.nanvix_tag }}
      NANVIX_DOCKER_IMAGE: ${{ needs.get-nanvix-info.outputs.build_image_ref }}
      NANVIX_SDK_C_ABI: ${{ needs.get-nanvix-info.outputs.sdk_c_abi }}
      NANVIX_SDK_DIGEST: ${{ needs.get-nanvix-info.outputs.sdk_digest }}
      NANVIX_SDK_IMAGE_REF: ${{ needs.get-nanvix-info.outputs.sdk_image_ref }}
      NANVIX_SDK_LIBC_COMMIT: ${{ needs.get-nanvix-info.outputs.sdk_libc_commit }}
      NANVIX_SDK_LIBC_TAG: ${{ needs.get-nanvix-info.outputs.sdk_libc_tag }}
      NANVIX_SDK_PROVIDER: ${{ needs.get-nanvix-info.outputs.sdk_provider }}
      NANVIX_SDK_SYSROOT_SHA256: ${{ needs.get-nanvix-info.outputs.sdk_sysroot_sha256 }}
      NANVIX_SDK_VERSION: ${{ needs.get-nanvix-info.outputs.sdk_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install nanvix-zutil
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          NANVIX_ZUTIL_VERSION: ${{ needs.resolve-zutil-version.outputs.version }}
        run: |
          WHEEL_URL=$(gh api repos/nanvix/zutils/releases/tags/"$NANVIX_ZUTIL_VERSION" \
            --jq '.assets[] | select(.name | endswith(".whl")) | .browser_download_url')
          python3 -m pip install --break-system-packages "$WHEEL_URL"

      - name: Log in to GHCR
        if: startsWith(needs.get-nanvix-info.outputs.build_image_ref, 'ghcr.io/')
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup (with Docker)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          nanvix-zutil setup \
            --with-docker "$NANVIX_DOCKER_IMAGE" \
            --target "${{ matrix.target-arch }}" \
            --machine "${{ matrix.platform }}" \
            --mode "${{ matrix.process-mode }}" \
            --memory-size "${{ matrix.memory }}" \
            --host linux

      - name: Benchmark
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          BENCHMARK_ARGS: ${{ inputs.benchmark-args }}
          BENCHMARK_ARGS_JSON: ${{ inputs.benchmark-args-json }}
        run: |
          set -euo pipefail
          if [[ "$BENCHMARK_ARGS_JSON" != "[]" ]]; then
            if ! command -v jq >/dev/null 2>&1; then
              echo "::error::jq is required to parse benchmark-args-json"
              exit 1
            fi
            if ! jq -e 'type == "array" and all(.[]; type == "string")' >/dev/null <<< "$BENCHMARK_ARGS_JSON"; then
              echo "::error::benchmark-args-json must be a JSON array of strings, got: $BENCHMARK_ARGS_JSON"
              exit 1
            fi
            mapfile -t args < <(jq -r '.[] | select(length > 0)' <<< "$BENCHMARK_ARGS_JSON")
            if (( ${#args[@]} > 0 )); then
              nanvix-zutil benchmark -- "${args[@]}"
            else
              nanvix-zutil benchmark
            fi
          elif [[ -n "$BENCHMARK_ARGS" ]]; then
            read -r -a args <<< "$BENCHMARK_ARGS"
            nanvix-zutil benchmark -- "${args[@]}"
          else
            nanvix-zutil benchmark
          fi

      - name: Collect failure logs
        if: failure()
        run: |
          mkdir -p ci-logs
          cp -f /tmp/*.log ci-logs/ 2>/dev/null || true
          find .nanvix -type f -name "*.log" -exec cp -f {} ci-logs/ \; 2>/dev/null || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-failure-logs-${{ matrix.target-arch }}-${{ matrix.platform }}-${{ matrix.process-mode }}-${{ matrix.memory }}
          path: ci-logs/*
          if-no-files-found: warn

  # -------------------------------------------------------------------
  # Open a GitHub issue on any job failure
  # -------------------------------------------------------------------
  report-failure:
    needs: [get-nanvix-info, build, benchmark, release, windows-test]
    # Only report true failures (not cancellations from higher-priority runs).
    # The ci-passed gate intentionally still fails on cancelled for branch protection.
    if: >-
      always() &&
      inputs.caller-event-name != 'pull_request' &&
      (needs.build.result == 'failure'
       || needs.benchmark.result == 'failure'
       || needs.release.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Identify failed jobs
        id: failed
        run: |
          FAILED=""
          for pair in \
            "build:${{ needs.build.result }}" \
            "benchmark:${{ needs.benchmark.result }}" \
            "release:${{ needs.release.result }}"
          do
            JOB="${pair%%:*}"
            RESULT="${pair#*:}"
            if [[ "$RESULT" == "failure" ]]; then
              FAILED="${FAILED:+$FAILED, }${JOB} (${RESULT})"
            fi
          done
          echo "jobs=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Report failure
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          FAILED_JOBS: ${{ steps.failed.outputs.jobs }}
          FAILURE_ASSIGNEES: ${{ inputs.failure-assignees }}
          CALLER_EVENT: ${{ inputs.caller-event-name }}
          ORG: ${{ github.repository_owner }}
          TEAM_SLUG: ${{ inputs.failure-notify-team }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          RUN_URL="${{ github.server_url }}/${REPO}/actions/runs/${{ github.run_id }}"
          NANVIX_VER="${{ needs.get-nanvix-info.outputs.nanvix_version }}"
          TITLE="CI: Workflow failure (nanvix ${NANVIX_VER})"
          LABEL="ci-failure"
          TIMESTAMP="$(date -u '+%Y-%m-%d %H:%M UTC')"
          EVENT="$CALLER_EVENT"

          # Ensure the label exists.
          gh label create "$LABEL" \
            --repo "$REPO" \
            --description "Automated: CI workflow failure" \
            --color "D73A4A" 2>/dev/null || true

          # Use the caller-supplied assignee list.
          ADMINS="$FAILURE_ASSIGNEES"
          # Normalize: trim whitespace and strip leading @
          ADMINS=$(echo "$ADMINS" | tr ',' '\n' | sed 's/^[[:space:]]*@\{0,1\}//; s/[[:space:]]*$//' | tr '\n' ',' | sed 's/,$//')

          # Build the occurrence entry for this failure.
          OCCURRENCE="| ${TIMESTAMP} | ${EVENT} | ${NANVIX_VER} | ${FAILED_JOBS} | [#${{ github.run_number }}](${RUN_URL}) | [\`${GITHUB_SHA::7}\`](${{ github.server_url }}/${REPO}/commit/${{ github.sha }}) |"

          HEADER="| Date | Trigger | Nanvix Version | Failed Jobs | Workflow Run | Commit |"
          SEPARATOR="|------|---------|----------------|-------------|--------------|--------|"

          # Check if an open issue with the same label already exists.
          EXISTING=$(gh issue list --repo "$REPO" --label "$LABEL" --state open --limit 1 --json number,body --jq '.[0]' 2>/dev/null || echo "")

          if [[ -n "$EXISTING" && "$EXISTING" != "null" ]]; then
            ISSUE_NUM=$(echo "$EXISTING" | jq -r '.number')
            OLD_BODY=$(echo "$EXISTING" | jq -r '.body')

            # Migrate legacy 4-column table to 6-column if needed.
            if echo "$OLD_BODY" | grep -qF "| Date | Nanvix Version |" && \
               ! echo "$OLD_BODY" | grep -qF "| Date | Trigger |"; then
              OLD_BODY=$(echo "$OLD_BODY" | sed \
                -e "s/| Date | Nanvix Version | Workflow Run | Commit |/${HEADER}/" \
                -e "s/|------|----------------|--------------|--------|/${SEPARATOR}/")
            fi

            printf -v NEW_BODY '%s\n%s' "$OLD_BODY" "$OCCURRENCE"
            gh issue edit "$ISSUE_NUM" \
              --repo "$REPO" \
              --body "$NEW_BODY"

            # Post a comment so GitHub sends notifications to assignees/subscribers.
            TEAM_CC=""
            if [[ -n "$TEAM_SLUG" ]]; then
              printf -v TEAM_CC '\n\ncc @%s/%s' "$ORG" "$TEAM_SLUG"
            fi
            COMMENT_FORMAT='🔴 **New CI failure recorded** (%s)\n\n'
            COMMENT_FORMAT+='- **Trigger:** %s\n- **Nanvix Version:** %s\n'
            COMMENT_FORMAT+='- **Failed Jobs:** %s\n- **Run:** [#%s](%s)%s'
            # shellcheck disable=SC2059
            printf -v COMMENT_BODY "$COMMENT_FORMAT" \
              "$TIMESTAMP" \
              "$EVENT" \
              "$NANVIX_VER" \
              "$FAILED_JOBS" \
              "${{ github.run_number }}" \
              "$RUN_URL" \
              "$TEAM_CC"
            gh issue comment "$ISSUE_NUM" \
              --repo "$REPO" \
              --body "$COMMENT_BODY"

            echo "Updated existing issue #${ISSUE_NUM} with new occurrence and comment."
            exit 0
          fi

          TEAM_CC=""
          if [[ -n "$TEAM_SLUG" ]]; then
            printf -v TEAM_CC '\n\ncc @%s/%s' "$ORG" "$TEAM_SLUG"
          fi
          printf -v BODY '## CI Workflow Failure\n\n**Repository:** %s\n**Branch:** %s\n\n### Occurrences\n\n%s\n%s\n%s%s' \
            "$REPO" \
            "${{ github.ref_name }}" \
            "$HEADER" \
            "$SEPARATOR" \
            "$OCCURRENCE" \
            "$TEAM_CC"

          ASSIGNEE_ARGS=()
          if [[ -n "$ADMINS" ]]; then
            ASSIGNEE_ARGS=(--assignee "$ADMINS")
          fi

          gh issue create \
            --repo "$REPO" \
            --title "$TITLE" \
            --body "$BODY" \
            --label "$LABEL" \
            "${ASSIGNEE_ARGS[@]}"

  # -------------------------------------------------------------------
  # Create a GitHub release and trigger downstream workflows
  # -------------------------------------------------------------------
  release:
    needs: [resolve-zutil-version, get-nanvix-info, build, benchmark]
    if: >-
      !cancelled()
      && inputs.caller-event-name != 'pull_request'
      && needs.build.result == 'success'
      && (needs.benchmark.result == 'success' || needs.benchmark.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      release_published: ${{ steps.publish.outputs.release_published }}
      release_tag: ${{ steps.tag.outputs.release_tag }}
    env:
      NANVIX_ZUTIL_VERSION: ${{ needs.resolve-zutil-version.outputs.version }}
      PACKAGE_NAME: ${{ needs.get-nanvix-info.outputs.package_name }}
      PACKAGE_VERSION: ${{ needs.get-nanvix-info.outputs.package_version }}
      NANVIX_VERSION: ${{needs.get-nanvix-info.outputs.nanvix_version }}
      SDK_C_ABI: ${{ needs.get-nanvix-info.outputs.sdk_c_abi }}
      SDK_DIGEST: ${{ needs.get-nanvix-info.outputs.sdk_digest }}
      SDK_IMAGE_REF: ${{ needs.get-nanvix-info.outputs.sdk_image_ref }}
      SDK_LIBC_COMMIT: ${{ needs.get-nanvix-info.outputs.sdk_libc_commit }}
      SDK_PROVIDER_ID: ${{ needs.get-nanvix-info.outputs.sdk_provider_id }}
      SDK_SYSROOT_SHA256: ${{ needs.get-nanvix-info.outputs.sdk_sysroot_sha256 }}
      SDK_VERSION: ${{ needs.get-nanvix-info.outputs.sdk_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute release tag
        id: tag
        run: |
          SDK_REVISION="${SDK_VERSION##*-sdk.}"
          RELEASE_TAG="${PACKAGE_VERSION}-nanvix-${NANVIX_VERSION}-sdk.${SDK_REVISION}"
          if [[ '${{ inputs.use-release-sha }}' == 'true' ]]; then
            SHORT_SHA="${GITHUB_SHA::7}"
            RELEASE_TAG="${RELEASE_TAG}-${SHORT_SHA}"
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $RELEASE_TAG"

      - name: Download all build artifacts
        id: download-artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: release-artifacts
          pattern: ${{ env.PACKAGE_NAME }}-${{ env.PACKAGE_VERSION }}-*

      - name: Generate lockfile
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          WHEEL_URL=$(gh api repos/nanvix/zutils/releases/tags/"$NANVIX_ZUTIL_VERSION" \
            --jq '.assets[] | select(.name | endswith(".whl")) | .browser_download_url')
          python3 -m pip install "$WHEEL_URL"
          nanvix-zutil resolve > /dev/null
          nanvix-zutil lock --shallow

      - name: Generate SDK provenance asset
        run: |
          jq -nS \
            --arg sdk_version "$SDK_VERSION" \
            --arg provider_id "$SDK_PROVIDER_ID" \
            --arg image_ref "$SDK_IMAGE_REF" \
            --arg digest "$SDK_DIGEST" \
            --arg c_abi "$SDK_C_ABI" \
            --arg libc_commit "$SDK_LIBC_COMMIT" \
            --arg sysroot_sha256 "$SDK_SYSROOT_SHA256" \
            --arg source_commit "$GITHUB_SHA" \
            --arg package_name "$PACKAGE_NAME" \
            --arg package_version "$PACKAGE_VERSION" \
            '{
              schema_version: 1,
              package_name: $package_name,
              package_version: $package_version,
              source_commit: $source_commit,
              sdk_version: $sdk_version,
              provider_id: $provider_id,
              image_ref: $image_ref,
              digest: $digest,
              c_abi: $c_abi,
              libc_commit: $libc_commit,
              sysroot_sha256: $sysroot_sha256
            }' > sdk-provenance.json

      - name: Create release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.release_tag }}
        run: |
          set -euo pipefail

          printf -v NOTES 'Automated build from branch %s.\n\n**Build:** [#%s](%s)\n**Commit:** [%s](%s)\n**Nanvix:** [%s](%s)' \
            "${{ github.ref_name }}" \
            "${{ github.run_number }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${{ github.sha }}" \
            "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" \
            "${{ needs.get-nanvix-info.outputs.nanvix_sha }}" \
            "https://github.com/nanvix/nanvix/commit/${{ needs.get-nanvix-info.outputs.nanvix_sha }}"

          SDK_NOTES_FORMAT="%s\n\n**SDK:** \`%s\`\n**SDK image:** \`%s\`\n"
          SDK_NOTES_FORMAT+="**C ABI:** \`%s\`\n**libc commit:** \`%s\`\n"
          SDK_NOTES_FORMAT+="**sysroot SHA-256:** \`%s\`"
          # shellcheck disable=SC2059
          printf -v NOTES "$SDK_NOTES_FORMAT" \
            "$NOTES" \
            "$SDK_VERSION" \
            "$SDK_IMAGE_REF" \
            "$SDK_C_ABI" \
            "$SDK_LIBC_COMMIT" \
            "$SDK_SYSROOT_SHA256"

          if [[ -n "${{ inputs.release-notes-extra }}" ]]; then
            printf -v NOTES '%s\n\n%s' "$NOTES" "${{ inputs.release-notes-extra }}"
          fi

          mapfile -t assets < <(find release-artifacts \( -name '*.tar.gz' -o -name '*.tar.bz2' -o -name '*.zip' \) -print)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No release assets found — all builds may have failed"
            exit 1
          fi
          assets+=( .nanvix/nanvix.lock )
          assets+=( sdk-provenance.json )

          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            mkdir -p existing-release
            if ! gh release download "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --pattern sdk-provenance.json \
              --dir existing-release; then
              echo "::error::Existing SDK release has no provenance asset"
              exit 1
            fi
            jq -S 'del(.source_commit)' sdk-provenance.json \
              > candidate-provenance.json
            jq -S 'del(.source_commit)' existing-release/sdk-provenance.json \
              > existing-provenance.json
            if ! cmp -s candidate-provenance.json existing-provenance.json; then
              echo "::error::Refusing to clobber $RELEASE_TAG from a different immutable SDK tuple"
              exit 1
            fi
            echo "::notice::$RELEASE_TAG already exists; immutable assets were not replaced"
            echo "release_published=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            gh release create "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --title "Build ${GITHUB_SHA::7}" \
              --notes "$NOTES" \
              --latest \
              "${assets[@]}"
          fi
          echo "release_published=true" >> "$GITHUB_OUTPUT"

      - name: Trigger downstream workflows
        if: >-
          steps.publish.outputs.release_published == 'true'
          && inputs.downstream-dispatches != '[]'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          DISPATCHES: ${{ inputs.downstream-dispatches }}
          RELEASE_TAG: ${{ steps.tag.outputs.release_tag }}
          NANVIX_SHA: ${{ needs.get-nanvix-info.outputs.nanvix_sha }}
        run: |
          echo "$DISPATCHES" | jq -c '.[]' | while read -r entry; do
            REPO=$(echo "$entry" | jq -r '.repo')
            EVENT=$(echo "$entry" | jq -r '.event_type')
            echo "Dispatching $EVENT to $REPO..."
            gh api "repos/$REPO/dispatches" -X POST \
              -H "Accept: application/vnd.github+json" \
              -f "event_type=$EVENT" \
              -f "client_payload[nanvix_sha]=$NANVIX_SHA" \
              -f "client_payload[release_tag]=$RELEASE_TAG" \
              || echo "::warning::Failed to trigger $REPO"
          done

  # -------------------------------------------------------------------
  # Release on Windows for standalone
  # -------------------------------------------------------------------
  windows-release:
    needs: [get-nanvix-info, release]
    if: >-
      !cancelled()
      && needs.release.result == 'success'
      && needs.release.outputs.release_published == 'true'
      && inputs.windows-release
      && github.event_name != 'pull_request'
      && contains(fromJSON(inputs.process-modes), 'standalone')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
      NANVIX_TAG: ${{ needs.get-nanvix-info.outputs.nanvix_tag }}
      PACKAGE_NAME: ${{ needs.get-nanvix-info.outputs.package_name }}
      PACKAGE_VERSION: ${{ needs.get-nanvix-info.outputs.package_version }}
      NANVIX_SDK_C_ABI: ${{ needs.get-nanvix-info.outputs.sdk_c_abi }}
      NANVIX_SDK_DIGEST: ${{ needs.get-nanvix-info.outputs.sdk_digest }}
      NANVIX_SDK_IMAGE_REF: ${{ needs.get-nanvix-info.outputs.sdk_image_ref }}
      NANVIX_SDK_LIBC_COMMIT: ${{ needs.get-nanvix-info.outputs.sdk_libc_commit }}
      NANVIX_SDK_VERSION: ${{ needs.get-nanvix-info.outputs.sdk_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Download standalone tarballs from release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*-standalone-*.tar.gz" \
            --pattern "*-standalone-*.tar.bz2" \
            --dir release-download
          ls -la release-download/

      - name: Download Nanvix Windows binaries
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$NANVIX_TAG" \
            --repo nanvix/nanvix \
            --pattern "nanvix-windows-*-standalone-*.zip" \
            --dir nanvix-windows
          ls -la nanvix-windows/

      - name: Repackage standalone tarballs to Windows zips
        run: |
          set -euo pipefail
          shopt -s nullglob

          TARBALLS=(release-download/*standalone*.tar.gz release-download/*standalone*.tar.bz2)
          if [ ${#TARBALLS[@]} -eq 0 ]; then
            echo "::error::No standalone tarballs found in release-download"
            exit 1
          fi

          : > upload-list.txt
          for TARBALL in "${TARBALLS[@]}"; do
            echo "::group::Repackaging $TARBALL"
            WORK=$(mktemp -d)
            tar -xf "$TARBALL" -C "$WORK"
            DIST_DIR=$(find "$WORK" -mindepth 1 -maxdepth 1 -type d | head -1)
            DIR_NAME=$(basename "$DIST_DIR")

            # DIR_NAME is [<pkg>-]<platform>-standalone-<memsize>. Extract
            # the join key components; the upstream windows zip carries
            # extra tokens (arch prefix, -release- infix, sha suffix) so
            # glob loosely around each.
            MEMORY=${DIR_NAME##*-standalone-}
            PLATFORM=${DIR_NAME%-standalone-*}; PLATFORM=${PLATFORM##*-}
            WINZIP=$(find nanvix-windows -name "nanvix-windows-*${PLATFORM}-standalone-*${MEMORY}*.zip" | head -1)
            if [ -z "$WINZIP" ]; then
              echo "::warning::No matching nanvix-windows zip for ${PLATFORM}-${MEMORY}; skipping"
              echo "::endgroup::"
              continue
            fi
            echo "Using Nanvix Windows zip: $WINZIP"

            WINEX=$(mktemp -d)
            unzip -q "$WINZIP" -d "$WINEX"

            # Swap Linux host binaries for Windows equivalents.
            rm -f "$DIST_DIR/bin/nanvixd.elf"
            cp "$WINEX/nanvixd.exe" "$DIST_DIR/bin/nanvixd.exe"
            cp "$WINEX/kernel.elf" "$DIST_DIR/bin/kernel.elf"

            # Replace the Linux-built README with the caller's top-level
            # README (assumed to document the Windows workflow).
            if [ -e README.md ]; then
              cp README.md "$DIST_DIR/README.md"
            fi

            ZIP_NAME="${DIR_NAME}.zip"
            (cd "$WORK" && zip -r "$GITHUB_WORKSPACE/${ZIP_NAME}" "$DIR_NAME")
            echo "Created: $ZIP_NAME ($(stat -c%s "$ZIP_NAME") bytes)"
            echo "$ZIP_NAME" >> upload-list.txt
            echo "::endgroup::"
          done

          if [ ! -s upload-list.txt ]; then
            echo "::error::No Windows zips produced"
            exit 1
          fi

      - name: Upload zips to release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while IFS= read -r zip; do
            gh release upload "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              "$zip" --clobber
            echo "Uploaded $zip to release $RELEASE_TAG"
          done < upload-list.txt

  # -------------------------------------------------------------------
  # CI gate — single required status check for branch protection
  # -------------------------------------------------------------------
  ci-passed:
    needs:
      [
        resolve-zutil-version,
        get-nanvix-info,
        build,
        benchmark,
        release,
        windows-test,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream results
        run: |
          for result in \
            "${{ needs.resolve-zutil-version.result }}" \
            "${{ needs.get-nanvix-info.result }}" \
            "${{ needs.build.result }}"
          do
            if [[ "$result" != "success" ]]; then
              echo "Required upstream job did not succeed: $result"
              exit 1
            fi
          done
          # Release is event-gated: skipped is acceptable, anything else is not.
          RELEASE_RESULT="${{ needs.release.result }}"
          if [[ "$RELEASE_RESULT" != "success" && "$RELEASE_RESULT" != "skipped" ]]; then
            echo "release did not succeed: $RELEASE_RESULT"
            exit 1
          fi
          # windows-test is opt-in: skipped is acceptable, anything else is not.
          WIN_RESULT="${{ needs.windows-test.result }}"
          if [[ "$WIN_RESULT" != "success" && "$WIN_RESULT" != "skipped" ]]; then
            echo "windows-test did not succeed: $WIN_RESULT"
            exit 1
          fi
          # benchmark is opt-in: skipped is acceptable, anything else is not.
          BENCH_RESULT="${{ needs.benchmark.result }}"
          if [[ "$BENCH_RESULT" != "success" && "$BENCH_RESULT" != "skipped" ]]; then
            echo "benchmark did not succeed: $BENCH_RESULT"
            exit 1
          fi

  # -------------------------------------------------------------------
  # Auto-merge automation PRs after CI passes
  # -------------------------------------------------------------------
  auto-merge:
    needs: ci-passed
    if: >-
      always()
      && needs.ci-passed.result == 'success'
      && inputs.caller-event-name == 'pull_request'
      && (github.head_ref == 'automation/update-zutils-version'
          || github.head_ref == 'automation/update-nanvix-version'
          || github.head_ref == 'automation/update-nanvix-workflows')
    runs-on: ubuntu-latest
    steps:
      - name: Merge automation PR
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          # Fork protection: verify the PR head repo matches this repo.
          if ! HEAD_REPO=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRepositoryOwner,headRepository --jq '"\(.headRepositoryOwner.login)/\(.headRepository.name)"') || [[ -z "$HEAD_REPO" ]]; then
            echo "::error::Failed to resolve head repo for PR #$PR_NUMBER — aborting auto-merge"
            exit 1
          fi
          if [[ "$HEAD_REPO" != "$REPO" ]]; then
            echo "::warning::PR #$PR_NUMBER head repo ($HEAD_REPO) does not match $REPO — skipping auto-merge"
            exit 0
          fi

          echo "Merging automation PR #$PR_NUMBER on $REPO..."

          ATTEMPTS=3
          n=1
          MERGE_ERR="$(mktemp)"
          while [ "$n" -le "$ATTEMPTS" ]; do
            gh pr merge "$PR_NUMBER" --repo "$REPO" --merge --admin --delete-branch \
              || echo "::warning::Auto-merge attempt $n/$ATTEMPTS failed for PR #$PR_NUMBER"

            # Confirm from server state. Keep stdout clean for the comparison; a
            # read failure (auth/API outage) is surfaced with its cause but
            # still tolerated, so it stays distinguishable from "not merged".
            if MERGED=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json merged --jq '.merged' 2>"$MERGE_ERR"); then
              if [ "$MERGED" = "true" ]; then
                echo "PR #$PR_NUMBER merged."
                exit 0
              fi
            else
              echo "::warning::Could not read merge state for PR #$PR_NUMBER: $(cat "$MERGE_ERR")"
            fi

            # Back off using the attempt that just failed (5s, then 10s).
            [ "$n" -lt "$ATTEMPTS" ] && sleep $((n * 5))
            n=$((n + 1))
          done

          echo "::error::PR #$PR_NUMBER did not merge after $ATTEMPTS attempts"
          exit 1
