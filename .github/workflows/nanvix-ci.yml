# Reusable CI workflow for Nanvix library ports (zlib, bzip2, etc.).
# Consumer repos invoke this via a thin caller workflow that supplies
# repo-specific values through inputs and secrets.

name: Nanvix CI

on:
  workflow_call:
    inputs:
      zutil-version:
        description: nanvix-zutil version to install (e.g. v0.4.0).
        required: true
        type: string
      platforms:
        description: JSON array of target platforms.
        required: false
        default: '["hyperlight","microvm"]'
        type: string
      target-archs:
        description: JSON array of target architectures.
        required: false
        default: '["x86"]'
        type: string
      process-modes:
        description: JSON array of deployment modes.
        required: false
        default: '["multi-process","single-process","standalone"]'
        type: string
      memory-sizes:
        description: JSON array of memory configurations.
        required: false
        default: '["128mb"]'
        type: string
      matrix-exclude:
        description: >
          JSON array of {platform, process-mode} objects to exclude from the
          build matrix. Example: [{"platform":"hyperlight","process-mode":"single-process"}]
        required: false
        default: "[]"
        type: string
      standalone-test-args:
        description: Extra args passed to ./z test -- for modes in skip-full-test-modes.
        required: false
        default: "test-smoke test-integration"
        type: string
      skip-full-test-modes:
        description: JSON array of modes that skip the full ./z test and use standalone-test-args instead.
        required: false
        default: '["standalone"]'
        type: string
      downstream-dispatches:
        description: >
          JSON array of {repo, event_type} objects. Each entry triggers a
          repository_dispatch on the target repo after a successful release.
        required: false
        default: "[]"
        type: string
      caller-event-name:
        description: >
          github.event_name from the caller workflow. Required because the
          reusable workflow always sees "workflow_call".
        required: true
        type: string
      release-notes-extra:
        description: Extra markdown to append to the release notes.
        required: false
        default: ""
        type: string
      failure-assignees:
        description: >
          Comma-separated GitHub usernames to assign on CI failure issues.
          Replaces dynamic admin resolution which requires elevated token
          permissions not available via GITHUB_TOKEN.
        required: false
        default: "ppenna"
        type: string
    secrets:
      GH_TOKEN:
        description: >
          Token with repo read access (for zutil install and artifact downloads)
          and contents + pull-requests write (for the update-nanvix-version job).
        required: true
      DISPATCH_TOKEN:
        description: >
          Token with repo scope and admin access on consumer repos.
          Used for downstream dispatches, version update PRs, and
          auto-merging automation PRs (requires admin to bypass
          branch protection).
        required: true
    outputs:
      package_name:
        description: Package name resolved from the manifest.
        value: ${{ jobs.get-nanvix-info.outputs.package_name }}
      package_version:
        description: Package version resolved from the manifest.
        value: ${{ jobs.get-nanvix-info.outputs.package_version }}
      nanvix_version:
        description: Nanvix version resolved from the manifest.
        value: ${{ jobs.get-nanvix-info.outputs.nanvix_version }}
      nanvix_tag:
        description: Nanvix release tag.
        value: ${{ jobs.get-nanvix-info.outputs.nanvix_tag }}
      nanvix_sha:
        description: Nanvix commit SHA.
        value: ${{ jobs.get-nanvix-info.outputs.nanvix_sha }}

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  # -------------------------------------------------------------------
  # Job 1: Resolve Nanvix release metadata via nanvix-zutil
  # -------------------------------------------------------------------
  get-nanvix-info:
    name: Get Nanvix Info
    runs-on: ubuntu-latest
    outputs:
      nanvix_tag: ${{ steps.resolve.outputs.nanvix_tag }}
      nanvix_sha: ${{ steps.resolve.outputs.nanvix_sha }}
      nanvix_version: ${{ steps.resolve.outputs.nanvix_version }}
      package_name: ${{ steps.resolve.outputs.package_name }}
      package_version: ${{ steps.resolve.outputs.package_version }}
    steps:
      - uses: actions/checkout@v5

      - name: Install nanvix-zutil
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NANVIX_ZUTIL_VERSION: ${{ inputs.zutil-version }}
        run: |
          WHEEL_URL=$(gh api repos/nanvix/zutils/releases/tags/"$NANVIX_ZUTIL_VERSION" \
            --jq '.assets[] | select(.name | endswith(".whl")) | .browser_download_url')
          python3 -m pip install "$WHEEL_URL"

      - name: Resolve lockfile and extract release info
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: nanvix-zutil resolve >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------
  # Job 2: Matrix build — platform × process-mode × memory
  # -------------------------------------------------------------------
  build:
    needs: get-nanvix-info
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target-arch: ${{ fromJSON(inputs.target-archs) }}
        platform: ${{ fromJSON(inputs.platforms) }}
        process-mode: ${{ fromJSON(inputs.process-modes) }}
        memory: ${{ fromJSON(inputs.memory-sizes) }}
        exclude: ${{ fromJSON(inputs.matrix-exclude) }}
    name: ${{ matrix.target-arch }}-${{ matrix.platform }}-${{ matrix.process-mode }}-${{ matrix.memory }}
    container:
      image: nanvix/toolchain:latest-minimal
      options: --device /dev/kvm
    defaults:
      run:
        shell: bash
    env:
      NANVIX_TARGET: ${{ matrix.target-arch }}
      NANVIX_MACHINE: ${{ matrix.platform }}
      NANVIX_DEPLOYMENT_MODE: ${{ matrix.process-mode }}
      NANVIX_MEMORY_SIZE: ${{ matrix.memory }}
      NANVIX_VERSION: ${{ needs.get-nanvix-info.outputs.nanvix_tag }}
      USER: runner
    steps:
      - uses: actions/checkout@v5

      - name: Install gh CLI and pip
        run: |
          apt-get update -qq && apt-get install -y -qq gh python3-pip

      - name: Install nanvix-zutil
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NANVIX_ZUTIL_VERSION: ${{ inputs.zutil-version }}
        run: |
          WHEEL_URL=$(gh api repos/nanvix/zutils/releases/tags/"$NANVIX_ZUTIL_VERSION" \
            --jq '.assets[] | select(.name | endswith(".whl")) | .browser_download_url')
          python3 -m pip install --break-system-packages "$WHEEL_URL"

      - name: Setup
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: ./z setup

      - name: Build
        run: ./z build

      - name: Test
        if: ${{ !contains(fromJSON(inputs.skip-full-test-modes), matrix.process-mode) }}
        run: ./z test

      - name: Test (limited)
        if: ${{ contains(fromJSON(inputs.skip-full-test-modes), matrix.process-mode) }}
        run: ./z test -- ${{ inputs.standalone-test-args }}

      - name: Release
        if: success()
        run: ./z release

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: ${{ needs.get-nanvix-info.outputs.package_name }}-${{ needs.get-nanvix-info.outputs.package_version }}-${{ matrix.target-arch }}-${{ matrix.platform }}-${{ matrix.process-mode }}-${{ matrix.memory }}
          path: |
            dist/*.tar.bz2
            dist/*.zip
          retention-days: 7

      - name: Collect failure logs
        if: failure()
        run: |
          mkdir -p ci-logs
          cp -f /tmp/*.log ci-logs/ 2>/dev/null || true
          find .nanvix -type f -name "*.log" -exec cp -f {} ci-logs/ \; 2>/dev/null || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: failure-logs-${{ matrix.target-arch }}-${{ matrix.platform }}-${{ matrix.process-mode }}-${{ matrix.memory }}
          path: ci-logs/*
          if-no-files-found: warn

  # -------------------------------------------------------------------
  # Job 3: Open a GitHub issue on any job failure
  # -------------------------------------------------------------------
  report-failure:
    needs: [get-nanvix-info, build, release, update-nanvix-version]
    if: >-
      always() &&
      inputs.caller-event-name != 'pull_request' &&
      (needs.build.result != 'success' && needs.build.result != 'skipped'
       || needs.release.result != 'success' && needs.release.result != 'skipped'
       || needs.update-nanvix-version.result != 'success' && needs.update-nanvix-version.result != 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Identify failed jobs
        id: failed
        run: |
          FAILED=""
          for pair in \
            "build:${{ needs.build.result }}" \
            "release:${{ needs.release.result }}" \
            "update-nanvix-version:${{ needs.update-nanvix-version.result }}"
          do
            JOB="${pair%%:*}"
            RESULT="${pair#*:}"
            if [[ "$RESULT" != "success" && "$RESULT" != "skipped" ]]; then
              FAILED="${FAILED:+$FAILED, }${JOB} (${RESULT})"
            fi
          done
          echo "jobs=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Report failure
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          FAILED_JOBS: ${{ steps.failed.outputs.jobs }}
          FAILURE_ASSIGNEES: ${{ inputs.failure-assignees }}
          CALLER_EVENT: ${{ inputs.caller-event-name }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          RUN_URL="${{ github.server_url }}/${REPO}/actions/runs/${{ github.run_id }}"
          NANVIX_VER="${{ needs.get-nanvix-info.outputs.nanvix_version }}"
          TITLE="CI: Workflow failure (nanvix ${NANVIX_VER})"
          LABEL="ci-failure"
          TIMESTAMP="$(date -u '+%Y-%m-%d %H:%M UTC')"
          EVENT="$CALLER_EVENT"

          # Ensure the label exists.
          gh label create "$LABEL" \
            --repo "$REPO" \
            --description "Automated: CI workflow failure" \
            --color "D73A4A" 2>/dev/null || true

          # Use the caller-supplied assignee list.
          ADMINS="$FAILURE_ASSIGNEES"
          # Normalize: trim whitespace and strip leading @
          ADMINS=$(echo "$ADMINS" | tr ',' '\n' | sed 's/^[[:space:]]*@\{0,1\}//; s/[[:space:]]*$//' | tr '\n' ',' | sed 's/,$//')

          # Build the occurrence entry for this failure.
          OCCURRENCE="| ${TIMESTAMP} | ${EVENT} | ${NANVIX_VER} | ${FAILED_JOBS} | [#${{ github.run_number }}](${RUN_URL}) | [\`${GITHUB_SHA::7}\`](${{ github.server_url }}/${REPO}/commit/${{ github.sha }}) |"

          HEADER="| Date | Trigger | Nanvix Version | Failed Jobs | Workflow Run | Commit |"
          SEPARATOR="|------|---------|----------------|-------------|--------------|--------|"

          # Check if an open issue with the same label already exists.
          EXISTING=$(gh issue list --repo "$REPO" --label "$LABEL" --state open --limit 1 --json number,body --jq '.[0]' 2>/dev/null || echo "")

          if [[ -n "$EXISTING" && "$EXISTING" != "null" ]]; then
            ISSUE_NUM=$(echo "$EXISTING" | jq -r '.number')
            OLD_BODY=$(echo "$EXISTING" | jq -r '.body')

            # Migrate legacy 4-column table to 6-column if needed.
            if echo "$OLD_BODY" | grep -qF "| Date | Nanvix Version |" && \
               ! echo "$OLD_BODY" | grep -qF "| Date | Trigger |"; then
              OLD_BODY=$(echo "$OLD_BODY" | sed \
                -e "s/| Date | Nanvix Version | Workflow Run | Commit |/${HEADER}/" \
                -e "s/|------|----------------|--------------|--------|/${SEPARATOR}/")
            fi

            printf -v NEW_BODY '%s\n%s' "$OLD_BODY" "$OCCURRENCE"
            gh issue edit "$ISSUE_NUM" \
              --repo "$REPO" \
              --body "$NEW_BODY"

            # Post a comment so GitHub sends notifications to assignees/subscribers.
            printf -v COMMENT_BODY '🔴 **New CI failure recorded** (%s)\n\n- **Trigger:** %s\n- **Nanvix Version:** %s\n- **Failed Jobs:** %s\n- **Run:** [#${{ github.run_number }}](%s)' \
              "$TIMESTAMP" \
              "$EVENT" \
              "$NANVIX_VER" \
              "$FAILED_JOBS" \
              "$RUN_URL"
            gh issue comment "$ISSUE_NUM" \
              --repo "$REPO" \
              --body "$COMMENT_BODY"

            echo "Updated existing issue #${ISSUE_NUM} with new occurrence and comment."
            exit 0
          fi

          printf -v BODY '## CI Workflow Failure\n\n**Repository:** %s\n**Branch:** %s\n\n### Occurrences\n\n%s\n%s\n%s' \
            "$REPO" \
            "${{ github.ref_name }}" \
            "$HEADER" \
            "$SEPARATOR" \
            "$OCCURRENCE"

          ASSIGNEE_ARGS=()
          if [[ -n "$ADMINS" ]]; then
            ASSIGNEE_ARGS=(--assignee "$ADMINS")
          fi

          gh issue create \
            --repo "$REPO" \
            --title "$TITLE" \
            --body "$BODY" \
            --label "$LABEL" \
            "${ASSIGNEE_ARGS[@]}"

  # -------------------------------------------------------------------
  # Job 4: Create a GitHub release and trigger downstream workflows
  # -------------------------------------------------------------------
  release:
    needs: [get-nanvix-info, build]
    if: ${{ !cancelled() && inputs.caller-event-name != 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      NANVIX_ZUTIL_VERSION: ${{ inputs.zutil-version }}
    steps:
      - uses: actions/checkout@v5

      - name: Download all build artifacts
        id: download-artifacts
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          path: release-artifacts
          pattern: ${{ needs.get-nanvix-info.outputs.package_name }}-${{ needs.get-nanvix-info.outputs.package_version }}-*

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          if [[ "${{ steps.download-artifacts.outcome }}" == "failure" ]]; then
            echo "::warning::Artifact download failed — possible API or network issue"
          fi
          find release-artifacts \( -name "*.tar.bz2" -o -name "*.zip" \) -exec cp {} release-assets/ \; 2>/dev/null || true
          ASSET_COUNT=$(find release-assets -name "*.tar.bz2" 2>/dev/null | wc -l)
          echo "Found $ASSET_COUNT release asset(s)"
          if [[ "$ASSET_COUNT" -eq 0 ]]; then
            echo "::error::No release assets found — all matrix builds may have failed"
            exit 1
          fi
          ls -la release-assets/

      - name: Generate lockfile
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          WHEEL_URL=$(gh api repos/nanvix/zutils/releases/tags/"$NANVIX_ZUTIL_VERSION" \
            --jq '.assets[] | select(.name | endswith(".whl")) | .browser_download_url')
          python3 -m pip install "$WHEEL_URL"
          nanvix-zutil resolve > /dev/null
          nanvix-zutil lock --shallow
          cp .nanvix/nanvix.lock release-assets/nanvix.lock

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          RELEASE_TAG="${{ needs.get-nanvix-info.outputs.package_version }}-nanvix-${{ needs.get-nanvix-info.outputs.nanvix_version }}"

          if gh release view "$RELEASE_TAG" &>/dev/null; then
            echo "Release $RELEASE_TAG already exists — skipping"
            exit 0
          fi

          printf -v NOTES 'Automated build from branch %s.\n\n**Build:** [#%s](%s)\n**Commit:** [%s](%s)\n**Nanvix:** [%s](%s)' \
            "${{ github.ref_name }}" \
            "${{ github.run_number }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${{ github.sha }}" \
            "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" \
            "${{ needs.get-nanvix-info.outputs.nanvix_sha }}" \
            "https://github.com/nanvix/nanvix/commit/${{ needs.get-nanvix-info.outputs.nanvix_sha }}"

          if [[ -n "${{ inputs.release-notes-extra }}" ]]; then
            printf -v NOTES '%s\n\n%s' "$NOTES" "${{ inputs.release-notes-extra }}"
          fi

          gh release create "$RELEASE_TAG" \
            --title "Build ${GITHUB_SHA::7}" \
            --notes "$NOTES" \
            --latest \
            release-assets/*

      - name: Trigger downstream workflows
        if: ${{ success() && inputs.downstream-dispatches != '[]' }}
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          DISPATCHES: ${{ inputs.downstream-dispatches }}
          RELEASE_TAG: ${{ needs.get-nanvix-info.outputs.package_version }}-nanvix-${{ needs.get-nanvix-info.outputs.nanvix_version }}
          NANVIX_SHA: ${{ needs.get-nanvix-info.outputs.nanvix_sha }}
        run: |
          echo "$DISPATCHES" | jq -c '.[]' | while read -r entry; do
            REPO=$(echo "$entry" | jq -r '.repo')
            EVENT=$(echo "$entry" | jq -r '.event_type')
            echo "Dispatching $EVENT to $REPO..."
            gh api "repos/$REPO/dispatches" -X POST \
              -H "Accept: application/vnd.github+json" \
              -f "event_type=$EVENT" \
              -f "client_payload[nanvix_sha]=$NANVIX_SHA" \
              -f "client_payload[release_tag]=$RELEASE_TAG" \
              || echo "::warning::Failed to trigger $REPO"
          done

  # -------------------------------------------------------------------
  # Job 5: Pin nanvix version in consumer repo
  # -------------------------------------------------------------------
  update-nanvix-version:
    name: Update Nanvix Version
    if: ${{ inputs.caller-event-name == 'schedule' || inputs.caller-event-name == 'repository_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.DISPATCH_TOKEN || secrets.GH_TOKEN }}

      - name: Checkout workflow scripts
        uses: actions/checkout@v5
        with:
          repository: nanvix/workflows
          path: .nanvix-workflows
          sparse-checkout: scripts

      - name: Resolve latest nanvix release tag
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: .nanvix-workflows/scripts/resolve-nanvix-tag.sh

      - name: Check current nanvix-version
        id: current
        run: .nanvix-workflows/scripts/check-nanvix-version.sh

      - name: Update nanvix-version and open PR
        if: ${{ steps.current.outputs.version != steps.latest.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN || secrets.GH_TOKEN }}
          LATEST_VERSION: ${{ steps.latest.outputs.version }}
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
          REPO: ${{ github.repository }}
        run: .nanvix-workflows/scripts/update-nanvix-version.sh

  # -------------------------------------------------------------------
  # Job 6: CI gate — single required status check for branch protection
  # -------------------------------------------------------------------
  ci-passed:
    needs: [get-nanvix-info, build, release, update-nanvix-version]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream results
        run: |
          for result in \
            "${{ needs.get-nanvix-info.result }}" \
            "${{ needs.build.result }}" \
            "${{ needs.release.result }}" \
            "${{ needs.update-nanvix-version.result }}"
          do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "Upstream job failed or was cancelled: $result"
              exit 1
            fi
          done

  # -------------------------------------------------------------------
  # Job 6b: Debug context visibility (temporary — remove after confirming)
  # -------------------------------------------------------------------
  debug-context:
    needs: ci-passed
    if: >-
      always()
      && inputs.caller-event-name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Dump context values
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          HEAD_REF_MATCH: ${{ github.head_ref == 'automation/update-zutils-version' || github.head_ref == 'automation/update-nanvix-version' || github.head_ref == 'automation/update-nanvix-workflows' }}
          OLD_HEAD_REF_MATCH: ${{ github.event.pull_request.head.ref == 'automation/update-zutils-version' || github.event.pull_request.head.ref == 'automation/update-nanvix-version' || github.event.pull_request.head.ref == 'automation/update-nanvix-workflows' }}
        run: |
          echo "=== Inputs ==="
          echo "caller-event-name: ${{ inputs.caller-event-name }}"
          echo ""
          echo "=== Top-level github context ==="
          echo "github.repository: ${{ github.repository }}"
          echo "github.event_name: ${{ github.event_name }}"
          echo "github.head_ref: $HEAD_REF"
          echo "github.base_ref: $BASE_REF"
          echo "github.ref: ${{ github.ref }}"
          echo "github.ref_name: $REF_NAME"
          echo ""
          echo "=== Shallow event properties ==="
          echo "github.event.number: ${{ github.event.number }}"
          echo "github.event.action: ${{ github.event.action }}"
          echo ""
          echo "=== Deeply nested event properties ==="
          echo "github.event.pull_request.number: ${{ github.event.pull_request.number }}"
          echo "github.event.pull_request.head.ref: $EVENT_HEAD_REF"
          echo "github.event.pull_request.head.repo.full_name: $EVENT_HEAD_REPO"
          echo "github.event.pull_request.base.ref: $EVENT_BASE_REF"
          echo "github.event.pull_request.base.repo.full_name: $EVENT_BASE_REPO"
          echo ""
          echo "=== Condition evaluation ==="
          echo "ci-passed result: ${{ needs.ci-passed.result }}"
          echo "head_ref match: $HEAD_REF_MATCH"
          echo "OLD deep full_name == repository: ${{ github.event.pull_request.head.repo.full_name == github.repository }}"
          echo "OLD deep head.ref match: $OLD_HEAD_REF_MATCH"

  # -------------------------------------------------------------------
  # Job 7: Auto-merge automation PRs after CI passes
  # -------------------------------------------------------------------
  auto-merge:
    needs: ci-passed
    if: >-
      always()
      && needs.ci-passed.result == 'success'
      && inputs.caller-event-name == 'pull_request'
      && (github.head_ref == 'automation/update-zutils-version'
          || github.head_ref == 'automation/update-nanvix-version'
          || github.head_ref == 'automation/update-nanvix-workflows')
    runs-on: ubuntu-latest
    steps:
      - name: Merge automation PR
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          # Fork protection: verify the PR head repo matches this repo.
          if ! HEAD_REPO=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRepositoryOwner,headRepository --jq '"\(.headRepositoryOwner.login)/\(.headRepository.name)"') || [[ -z "$HEAD_REPO" ]]; then
            echo "::error::Failed to resolve head repo for PR #$PR_NUMBER — aborting auto-merge"
            exit 1
          fi
          if [[ "$HEAD_REPO" != "$REPO" ]]; then
            echo "::warning::PR #$PR_NUMBER head repo ($HEAD_REPO) does not match $REPO — skipping auto-merge"
            exit 0
          fi

          echo "Merging automation PR #$PR_NUMBER on $REPO..."
          gh pr merge "$PR_NUMBER" --repo "$REPO" --merge --admin --delete-branch || {
            echo "::warning::Auto-merge failed for PR #$PR_NUMBER"
          }
