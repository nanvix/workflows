# Lint all workflow YAML files on every push and pull request.

name: Lint Workflows

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - "consumer-registry.json"
      - "scripts/**"
      - "tests/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - "consumer-registry.json"
      - "scripts/**"
      - "tests/**"

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint
        run: |
          ACTIONLINT_VERSION="1.7.11"
          EXPECTED_SHA="900919a84f2229bac68ca9cd4103ea297abc35e9689ebb842c6e34a3d1b01b0a"
          TARBALL="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${TARBALL}"
          echo "${EXPECTED_SHA}  ${TARBALL}" | sha256sum -c -
          tar xz -f "${TARBALL}" actionlint
          install actionlint /usr/local/bin/actionlint
          rm -f "${TARBALL}" actionlint

      - name: Run actionlint
        run: actionlint -color

  foundation:
    name: Foundation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shfmt
        run: |
          SHFMT_VERSION="v3.13.0"
          SHFMT_SHA256="70aa99784703a8d6569bbf0b1e43e1a91906a4166bf1a79de42050a6d0de7551"
          curl -fsSL \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64" \
            -o /tmp/shfmt
          echo "${SHFMT_SHA256}  /tmp/shfmt" | sha256sum -c -
          sudo install -m 755 /tmp/shfmt /usr/local/bin/shfmt

      - name: Run foundation tests
        run: tests/run-tests.sh

      - name: Lint scripts
        run: |
          shellcheck scripts/*.sh tests/run-tests.sh
          shfmt -d -i 4 -ci scripts/*.sh tests/run-tests.sh
          python3 -m py_compile scripts/validate-update-patch.py
